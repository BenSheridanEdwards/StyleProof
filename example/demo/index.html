<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StyleProof demo</title>
    <!--
      Deterministic page StyleProof certifies against itself in CI
      (test/dogfood.e2e.spec.ts). No web fonts, no animation, no live data.
      Contracts: .btn background is restyled; ?ctaTone=head restyles Save for
      Phase 1 (#669); ?structure=head injects p.structure-callout for Phase 1
      (#670); ?ctaTone=equiv is hex-equivalent to base for #672;
      status-card loading/loaded + data-tone=head; exactly
      @media 600 / 900.

      One situation at a time. Default is the atom: a single command button.
      ?scale=organism opens a modal that uses the same button. Forced
      :hover/:focus/:active live on .btn and are captured by StyleProof.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: rgb(214, 228, 232);
        background: rgb(7, 9, 12);
      }
      header {
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgb(36, 48, 54);
      }
      header .brand {
        font-weight: 650;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      header .tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgb(126, 214, 208);
        border: 1px solid rgb(38, 92, 88);
        padding: 3px 8px;
      }
      header .header-end {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      a.link {
        color: rgb(126, 214, 208);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        border: 0 solid transparent;
        padding: 8px 2px;
      }
      a.link:hover {
        color: rgb(165, 243, 252);
        border-color: transparent;
      }
      a.link:focus {
        outline: 2px solid rgb(94, 234, 212);
        outline-offset: 3px;
      }
      a.link:active {
        color: rgb(45, 212, 191);
        border-color: transparent;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      .status-card {
        margin: 0 0 48px;
        padding: 8px 10px;
        border: 1px solid rgb(56, 132, 220);
        background: rgb(14, 28, 48);
        color: rgb(147, 197, 253);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .status-card.loaded {
        border-color: rgb(52, 211, 153);
        background: rgb(10, 36, 28);
        color: rgb(167, 243, 208);
      }
      .status-card.loaded[data-tone='head'] {
        border-color: rgb(251, 146, 60);
        background: rgb(42, 24, 10);
        color: rgb(254, 215, 170);
      }
      .stage {
        display: none;
      }
      body[data-scale='atom'] .stage-atom,
      body[data-scale='organism'] .stage-organism {
        display: block;
      }
      .stage-label {
        margin: 0 0 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgb(126, 214, 208);
      }
      .stage-note {
        margin: 16px 0 0;
        color: rgb(154, 170, 176);
        font-size: 14px;
        line-height: 1.45;
        max-width: 28em;
      }
      .btn {
        display: inline-block;
        margin: 0;
        padding: 12px 22px;
        border: 1px solid rgb(56, 214, 198);
        border-radius: 2px;
        background: rgb(20, 184, 166);
        color: rgb(7, 9, 12);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .btn:hover {
        background: rgb(7, 9, 12);
        color: rgb(94, 234, 212);
        border-color: rgb(94, 234, 212);
      }
      .btn:focus {
        outline: 3px solid rgb(94, 234, 212);
        outline-offset: 3px;
        border-color: rgb(165, 243, 252);
      }
      .btn:active {
        background: rgb(13, 148, 136);
        border-color: rgb(15, 118, 110);
      }
      /* Phase 1 (#669): deterministic head-side restyle toggled by ?ctaTone=head */
      .btn[data-cta-tone='head'] {
        background: rgb(220, 38, 38);
        border-color: rgb(185, 28, 28);
      }
      /* Phase 1 (#670): deterministic head-side DOM addition toggled by ?structure=head */
      .structure-callout {
        margin: 0 0 14px;
        padding: 8px 10px;
        border: 1px solid rgb(251, 191, 36);
        background: rgb(42, 32, 10);
        color: rgb(254, 215, 170);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* Phase 1 (#672): equivalent spelling — hex computes to the same rgb as .btn */
      .btn[data-cta-tone='equiv'] {
        background: #14b8a6;
        border-color: #38d6c6;
      }
      .btn[data-cta-tone='equiv']:hover {
        background: rgb(7, 9, 12);
        color: rgb(94, 234, 212);
        border-color: rgb(94, 234, 212);
      }
      .btn[data-cta-tone='equiv']:focus {
        outline: 3px solid rgb(94, 234, 212);
        outline-offset: 3px;
        border-color: rgb(165, 243, 252);
      }
      .btn[data-cta-tone='equiv']:active {
        background: rgb(13, 148, 136);
        border-color: rgb(15, 118, 110);
      }
      .modal {
        max-width: 420px;
        padding: 22px 22px 18px;
        border: 1px solid rgb(56, 72, 78);
        background: rgb(10, 13, 18);
      }
      .modal h2 {
        margin: 0 0 8px;
        font-size: 18px;
        letter-spacing: -0.02em;
        color: rgb(236, 244, 246);
      }
      .modal p {
        margin: 0 0 18px;
        color: rgb(154, 170, 176);
        line-height: 1.45;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .btn-ghost {
        display: inline-block;
        padding: 12px 18px;
        border: 1px solid rgb(56, 72, 78);
        border-radius: 2px;
        background: transparent;
        color: rgb(176, 190, 196);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* Two real breakpoints — the dogfood asserts detection finds exactly these. */
      @media (min-width: 600px) {
        main {
          padding: 36px 32px 56px;
        }
        .btn {
          padding: 13px 24px;
        }
      }
      @media (min-width: 900px) {
        main {
          max-width: 880px;
        }
        .btn {
          padding: 14px 28px;
        }
      }
    </style>
  </head>
  <body data-scale="atom">
    <header>
      <span class="brand">StyleProof</span>
      <div class="header-end">
        <a class="link" href="#docs">Docs</a>
        <span class="tag">demo</span>
      </div>
    </header>
    <main>
      <section class="status-card loading" role="status" aria-live="polite" aria-busy="true">
        Preparing dashboard
      </section>
      <section class="stage stage-atom" aria-label="Atom">
        <p class="stage-label">Atom</p>
        <button class="btn" type="button">Save</button>
        <p class="stage-note">
          Save is the atom. Docs in the header is a second component, used for hover,
          focus, and active. StyleProof certifies each one on its own.
        </p>
      </section>
      <section class="stage stage-organism" aria-label="Organism" hidden>
        <p class="stage-label">Organism</p>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-title">
          <h2 id="save-title">Save changes?</h2>
          <p>The same button, now the primary action of a modal.</p>
          <div class="modal-actions">
            <button class="btn-ghost" type="button">Cancel</button>
            <button class="btn" type="button">Save</button>
          </div>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const state = params.get('state') === 'loaded' ? 'loaded' : 'loading';
      const tone = state === 'loaded' && params.get('tone') === 'head' ? 'head' : 'base';
      const ctaToneParam = params.get('ctaTone');
      const ctaTone =
        ctaToneParam === 'head' || ctaToneParam === 'equiv' ? ctaToneParam : 'base';
      const structure = params.get('structure') === 'head' ? 'head' : 'base';
      const scale = params.get('scale') === 'organism' ? 'organism' : 'atom';
      const status = document.querySelector('.status-card');
      const organism = document.querySelector('.stage-organism');
      document.body.dataset.scale = scale;
      document.querySelectorAll('.btn').forEach((btn) => {
        btn.dataset.ctaTone = ctaTone;
      });
      const atomStage = document.querySelector('.stage-atom');
      if (structure === 'head' && atomStage) {
        const callout = document.createElement('p');
        callout.className = 'structure-callout';
        callout.textContent = 'Structure delta marker';
        const saveButton = atomStage.querySelector('.btn');
        atomStage.insertBefore(callout, saveButton);
      }
      status.className = `status-card ${state}`;
      status.dataset.tone = tone;
      status.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
      status.textContent = state === 'loading' ? 'Preparing dashboard' : 'Dashboard ready';
      if (organism) organism.hidden = scale !== 'organism';
    </script>
  </body>
</html>

# Every nonempty changed Git filename requires the browser lanes (e2e shards,
# evidence, detection corpus) and the four dogfood workflows. No path is exempt.
# Each workflow uses this file with predicate-quantifier: every.
#
# The pinned picomatch compiles ** and negations using dot, which misses legal
# line terminators in filenames. This sole positive pattern uses [\s\S]: every
# code unit is either whitespace or non-whitespace, including all line terminators.
# Its + requires a nonempty filename; no change-status condition can exclude one.
# scripts/ci-path-filters.mjs validates this exact policy shape for the local hook.
lanes:
  - '([\s\S]+)'

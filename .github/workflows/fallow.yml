name: Fallow

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # needed for comment/review-comments

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # best diff precision for --changed-since and hotspots
      # Build dist/ first so fallow can resolve the test suite's `../dist/*.js`
      # imports — tests run against the compiled output, so without a build those
      # imports read as "unresolved" (a false dead-code finding). dist is
      # .gitignored, so it's resolved-against but not itself analysed.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          no-cache: true
          comment: true
          review-comments: true
          # Grandfather the same known-complex functions the complexity gate below
          # does, so editing a file that merely CONTAINS a pre-existing god-function
          # doesn't fail the audit; genuinely new complexity (not in the baseline)
          # still gates. Mirrors the pre-commit hook. New dead-code/duplication in
          # changed files still gates regardless.
          health-baseline: .fallow/health-baseline.json
      # Coverage-independent complexity gate (production mode → src/bin, skips tests).
      # Use the exact lockfile-pinned binary and its baseline-aware exit semantics.
      # The Action wrapper gates on the pre-baseline functions_above_threshold
      # summary, which can reject an envelope whose post-baseline findings are empty.
      - name: Complexity gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(node --input-type=module -e '
            import fs from "node:fs";
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const sha = event?.pull_request?.base?.sha;
            if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error("missing or invalid pull request base SHA");
            process.stdout.write(sha);
          ')
          ./node_modules/.bin/fallow health \
            --production \
            --changed-since "$BASE_SHA" \
            --baseline .fallow/health-baseline.json \
            --no-cache \
            --fail-on-issues

name: patch-711-cli-test
on:
  push:
    branches: [fix/cli-spawn-timeout-711]
    paths:
      - .github/workflows/patch-711-cli-test.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cli-spawn-timeout-711
      - name: Patch cli.test.mjs imports and self-remove
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('test/cli.test.mjs'); t=p.read_text(); t=t.replace(\"import { spawnSync } from 'node:child_process';\\n\", '', 1); old=\"import { fixtureCommitSha, fixtureCompatibilityKey, makeMap, mkTmp, rmTmp, writeCapture } from './helpers.mjs';\"; new=\"import {\\n  fixtureCommitSha,\\n  fixtureCompatibilityKey,\\n  makeMap,\\n  mkTmp,\\n  rmTmp,\\n  spawnSyncBounded as spawnSync,\\n  writeCapture,\\n} from './helpers.mjs';\"; assert old in t, 'helpers import missing'; t=t.replace(old, new, 1); assert 'spawnSyncBounded as spawnSync' in t; p.write_text(t); Path('.github/workflows/patch-711-cli-test.yml').unlink()"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: wire cli.test.mjs to spawnSyncBounded (#711)"
          git push origin HEAD:fix/cli-spawn-timeout-711

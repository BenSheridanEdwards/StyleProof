name: Reach cost

# Measures what recording reach evidence (CSS rule usage, V8 block coverage) adds
# to a capture (#989). Informational: it never gates a merge. It runs on a GitHub
# runner because timings from a busy workstation are noise, and only when the bench
# itself changes, so ordinary pull requests pay nothing for it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bench/reach-cost.mjs'
      - 'bench/fixtures/reach-cost/**'
      - '.github/workflows/reach-cost.yml'

permissions:
  contents: read

concurrency:
  group: reach-cost-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: reach cost (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure
        shell: bash
        run: |
          rm -f bench/reach-cost.results.json
          node bench/reach-cost.mjs --runs 7 | tee reach-cost.txt
          test -s bench/reach-cost.results.json

      - name: Step summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reach-cost.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bench/reach-cost.results.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

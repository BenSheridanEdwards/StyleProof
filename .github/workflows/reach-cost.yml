name: Reach cost

# Measures what recording reach evidence (CSS rule usage, V8 block coverage) adds
# to a capture (#989). Informational: it never gates a merge. It runs on a GitHub
# runner because timings from a busy workstation are noise, and only when the bench
# itself changes, so ordinary pull requests pay nothing for it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bench/reach-cost.mjs'
      - 'bench/fixtures/reach-cost/**'
      - '.github/workflows/reach-cost.yml'

permissions:
  contents: read

concurrency:
  group: reach-cost-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: reach cost (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Measure
        shell: bash
        run: |
          rm -f bench/reach-cost.results.json
          node bench/reach-cost.mjs --runs 7 | tee reach-cost.txt
          test -s bench/reach-cost.results.json

      - name: Step summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reach-cost.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: reach-cost
          path: bench/reach-cost.results.json

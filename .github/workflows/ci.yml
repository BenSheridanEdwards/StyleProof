name: CI

on:
  pull_request:
  push:
    branches: [main]

# Library CI only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.2
        id: filter
        with:
          # On push to main, compare against the previous commit; on PR, against the base.
          filters: |
            e2e:
              - 'src/capture/**'
              - 'src/diff.ts'
              - 'src/report/**'
              - 'src/runner/**'
              - 'src/**'
              - 'test/**/*.e2e.spec.ts'
              - 'test/helpers.mjs'
              - 'test/fixtures/**'
              - 'playwright.ci.config.ts'
              - 'playwright.config.ts'
              - 'bench/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'scripts/verify-e2e-shards.mjs'

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ESLint 10's formatter uses newer Node APIs when printing findings. Keep
      # runtime support proven on every Node version, but run lint/format once on
      # the supported toolchain.
      - name: Lint
        if: matrix.node == '22'
        run: npm run lint

      - name: Format check
        if: matrix.node == '22'
        run: npm run format:check
      - name: Privacy check
        if: matrix.node == '22'
        env:
          STYLEPROOF_PRIVACY_DENYLIST: ${{ secrets.STYLEPROOF_PRIVACY_DENYLIST }}
        run: npm run privacy:check

      # Fail the build on a known high/critical-severity vulnerability in the
      # dependency tree. Runs once on the supported toolchain, like lint/format.
      - name: Dependency audit
        if: matrix.node == '22'
        run: npm audit --audit-level=high

      # The committed demo report (docs/demo/) must match what the current report
      # renderer produces — so every PR shows the REAL report, never a stale one.
      # Deterministic synthetic inputs, so this is gate-safe on one Node version.
      - name: Demo report up to date
        if: matrix.node == '22'
        run: node scripts/demo-report.mjs --check

      - name: Unit tests
        # Build already emitted and typechecked this exact checkout above.
        # Coverage thresholds need Node 22.8+; keep plain units on 18/20.
        if: matrix.node != '22'
        run: npm run test:unit

      - name: Unit tests + coverage floor
        # Same suite as test:unit, with Node built-in coverage gated at the
        # measured dist/ floor (see scripts/check-coverage.mjs / CONTRIBUTING).
        if: matrix.node == '22'
        run: npm run test:coverage

  # Run the complete browser and determinism path beside the Node matrix instead
  # of placing it after every Node 22 static and unit gate.
  e2e:
    name: e2e (node 22, shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The one place the browser capture path (page.evaluate + CDP) is
      # exercised — a self-contained file:// fixture, no live server. The
      # Node-sensitive paths remain covered by units on 18, 20, and 22.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Install browsers (cache hit, no OS deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium firefox

      # Shard 1 generates the full test inventory so the evidence job can verify
      # completeness without installing Playwright again. If-condition ensures
      # only one shard produces the canonical inventory.
      - name: Collect test inventory
        if: matrix.shard == 1
        run: |
          mkdir -p .styleproof/ci
          npx playwright test --config=playwright.ci.config.ts --list --reporter=json > .styleproof/ci/inventory.json

      - name: Browser shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .styleproof/ci/shard.json
          STYLEPROOF_DETERMINISM_RECEIPT: .styleproof/ci/determinism-oracle.json
        run: npx playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/3 --reporter=line,json

      - name: Upload browser shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: .styleproof/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # The evidence job verifies that the shards cover the full inventory and that
  # the determinism oracle proved repeatability. The inventory is produced by
  # shard 1 (no separate Playwright install needed here), so this job only needs
  # Node.js to run the verification script — a pure-Node path with no npm ci.
  e2e-evidence:
    name: e2e (node 22)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v6
        with:
          pattern: e2e-shard-*
          path: .styleproof/ci/shards
      - name: Verify complete browser evidence and print determinism oracle receipt
        run: node scripts/verify-e2e-shards.mjs .styleproof/ci/shards/e2e-shard-1/inventory.json .styleproof/ci/shards 3
      - name: Upload verified browser evidence
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-node-22
          path: .styleproof/ci/shards/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  cli-smoke:
    name: cli smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node --test test/package-smoke.test.mjs

  # Detection-rate corpus: the seeded-mutation measurement must stay green, or a
  # detector regression lands silently. Needs Chromium, so it mirrors the e2e
  # browser setup (chromium only — the fixture has no firefox path).
  detection-corpus:
    name: detection corpus
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browsers (cache hit, no OS deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Detection-rate corpus
        run: node bench/detection-rate.mjs --check

  # Stable branch-protection context. Browser lanes may skip when no e2e
  # paths changed (docs-only / pure unit tests); skipped counts as success.
  required:
    name: required
    if: always()
    needs: [changes, build, e2e, e2e-evidence, cli-smoke, detection-corpus]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_EVIDENCE_RESULT: ${{ needs.e2e-evidence.result }}
          CLI_SMOKE_RESULT: ${{ needs.cli-smoke.result }}
          DETECTION_CORPUS_RESULT: ${{ needs.detection-corpus.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$CLI_SMOKE_RESULT" = success
          # Browser lanes: success when they ran, or skipped when path-filter said no.
          for name in E2E_RESULT E2E_EVIDENCE_RESULT DETECTION_CORPUS_RESULT; do
            val="${!name}"
            if [ "$val" != success ] && [ "$val" != skipped ]; then
              echo "::error::$name was '$val' (want success or skipped)"
              exit 1
            fi
          done
          if [ "$E2E_RESULT" = skipped ]; then
            echo "e2e/detection skipped — no browser-surface paths"
          fi

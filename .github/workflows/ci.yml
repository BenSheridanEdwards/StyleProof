name: CI

on:
  pull_request:
  push:
    branches: [main]

# Library CI only reads the repo.
permissions:
  contents: read

# Cancel superseded PR runs; each main commit gets its own group so queued main runs are never dropped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Browser tree proof
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.decide.outputs.lanes }}
      e2e_proof: ${{ steps.decide.outputs.proof }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: decide
        run: node scripts/browser-lanes.mjs --github

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the engines.node floor, tested exactly; 22 and 24 are the
        # current LTS lines. The run-once gates below use the '22' leg.
        node: ['22.13.0', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Build
        run: pnpm run build

      # Lint, format, privacy, audit, and demo run once, on the '22' leg.
      - name: Lint
        if: matrix.node == '22'
        run: pnpm run lint

      # Vendored anti-slop Oxlint rules; only rules set to error fail (ADR 0010).
      - name: Anti-slop lint
        if: matrix.node == '22'
        run: pnpm run lint:slop

      - name: Format check
        if: matrix.node == '22'
        run: pnpm run format:check

      # The agent docs keep their pointer chain, links and unique ADR numbers,
      # and every suppression comment says why (ADR 0007).
      - name: Context layer
        if: matrix.node == '22'
        run: pnpm run check:context

      - name: Suppressions
        if: matrix.node == '22'
        run: pnpm run check:suppressions
      - name: Privacy check
        if: matrix.node == '22'
        env:
          STYLEPROOF_PRIVACY_DENYLIST: ${{ secrets.STYLEPROOF_PRIVACY_DENYLIST }}
        run: pnpm run privacy:check

      # Fail the build on a known high/critical-severity vulnerability in the
      # dependency tree. Runs once on the supported toolchain, like lint/format.
      - name: Dependency audit
        if: matrix.node == '22'
        run: pnpm audit --audit-level=high

      # The committed demo report (docs/demo/) must match what the current report
      # renderer produces — so every PR shows the REAL report, never a stale one.
      # Deterministic synthetic inputs, so this is gate-safe on one Node version.
      - name: Demo report up to date
        if: matrix.node == '22'
        run: node scripts/demo-report.mjs --check

      - name: Node quick check
        # Build already emitted and typechecked this exact checkout on this Node.
        # The full unit suite runs once, in the Node 22 coverage job. The floor
        # and 24 legs run a quick check: the packed-CLI smoke, config loading
        # and the test runner itself, the paths that differ between Node lines.
        if: matrix.node != '22'
        run: pnpm run test:node-compat

  coverage:
    name: coverage (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Unit coverage
        run: pnpm run test:coverage

  # Run the complete browser and determinism path beside the Node matrix instead
  # of placing it after every Node 22 static and unit gate.
  # Playwright hands each shard an equal COUNT of test groups in file order, so
  # the heavy parallel-mode files at the front of the alphabet (auth-*, capture-*,
  # cli-flow) all landed in shard 1 of 4: 241s of tests against 109-157s for the
  # rest, and the longest leg of the whole pipeline. Six shards split that front
  # block; measured per-test durations put the slowest shard near 175s.
  e2e:
    name: e2e (node 22, shard ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Build
        run: pnpm run build

      # The one place the browser capture path (page.evaluate + CDP) is
      # exercised — a self-contained file:// fixture, no live server. The
      # Node-sensitive paths remain covered by units on every build matrix leg.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox

      - name: Install browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Install browsers (cache hit, no OS deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium firefox
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-cache.outputs.cache-primary-key != ''
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # One shard generates the full test inventory so the evidence job can verify
      # completeness without installing Playwright again. If-condition ensures
      # only one shard produces the canonical inventory. The ~20s listing runs on
      # shard 5, the lightest of six, so it never lengthens the slowest shard.
      - name: Collect test inventory
        if: matrix.shard == 5
        run: |
          mkdir -p .styleproof/ci
          # --silent keeps pnpm's own "Already up to date" line out of the JSON.
          pnpm --silent exec playwright test --config=playwright.ci.config.ts --list --reporter=json > .styleproof/ci/inventory.json

      - name: Browser shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .styleproof/ci/shard.json
          STYLEPROOF_DETERMINISM_RECEIPT: .styleproof/ci/determinism-oracle.json
        run: pnpm exec playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/6 --reporter=line,json

      - name: Upload browser shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            .styleproof/ci/shard.json
            .styleproof/ci/determinism-oracle.json
            .styleproof/ci/inventory.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The evidence job verifies that the shards cover the full inventory and that
  # the determinism oracle proved repeatability. The inventory is produced by
  # shard 5 (no separate Playwright install needed here), so this job only needs
  # Node.js to run the verification script — a pure-Node path with no dependency install.
  e2e-evidence:
    name: e2e (node 22)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Shard artifacts expire after 1 day. After expiry, re-run the whole
      # workflow; re-running only e2e-evidence cannot download them.
      - uses: actions/download-artifact@v6
        with:
          pattern: e2e-shard-*
          path: .styleproof/ci/shards
      - name: Verify complete browser evidence and print determinism oracle receipt
        run: node scripts/verify-e2e-shards.mjs .styleproof/ci/shards/e2e-shard-5/inventory.json .styleproof/ci/shards 6

  cli-smoke:
    name: cli smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - run: pnpm run build
      - run: node --test test/package-smoke.test.mjs

  # Detection-rate corpus: the seeded-mutation measurement must stay green, or a
  # detector regression lands silently. The reach corpus (#988) runs here too: it
  # pins today's un-exercised-state miss and the prototype reach joins. Needs
  # Chromium, so it mirrors the e2e browser setup (chromium only — the fixtures
  # have no firefox path).
  detection-corpus:
    name: detection corpus
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Build
        run: pnpm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browsers (cache hit, no OS deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-cache.outputs.cache-primary-key != ''
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Detection-rate corpus
        run: node bench/detection-rate.mjs --check

      - name: Reach corpus
        run: node bench/reach-corpus.mjs --check

  # Stable branch-protection context. Every main push requires browser proof.
  # PR browser lanes may skip only when the decider succeeds with e2e == 'false'
  # and a same-tree proof for the merge commit and current base. 'true' requires the
  # e2e shards, evidence check and detection corpus to succeed. An empty, missing
  # or malformed decision, or a failed changes job, fails this check outright.
  # test/ci-required-policy.test.mjs executes this step against a table of cases.
  required:
    name: required
    if: always()
    needs: [changes, build, coverage, e2e, e2e-evidence, cli-smoke, detection-corpus]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_DECISION: ${{ needs.changes.outputs.e2e }}
          E2E_PROOF: ${{ needs.changes.outputs.e2e_proof }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_EVIDENCE_RESULT: ${{ needs.e2e-evidence.result }}
          CLI_SMOKE_RESULT: ${{ needs.cli-smoke.result }}
          DETECTION_CORPUS_RESULT: ${{ needs.detection-corpus.result }}
        run: |
          set -euo pipefail
          status=0
          reject() { echo "::error::$1"; status=1; }
          for name in CHANGES_RESULT BUILD_RESULT COVERAGE_RESULT CLI_SMOKE_RESULT; do
            val="${!name:-}"
            [ "$val" = success ] || reject "$name was '$val' (want success)"
          done
          # Trust the decision only when the changes job itself succeeded.
          decision="${E2E_DECISION:-}"
          [ "${CHANGES_RESULT:-}" = success ] || decision="untrusted (tree proof job did not succeed)"
          case "$decision" in
            true) echo "Tree proof: trees differ or are unproven; e2e shards, evidence and detection corpus must succeed" ;;
            false)
              if [[ "${E2E_PROOF:-}" =~ ^same-tree:([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
                echo "Tree proof: same-tree proof present; browser lanes may skip"
              else
                reject "Tree proof decision 'false' without same-tree proof ('${E2E_PROOF:-}')"
              fi
              ;;
            *) reject "Tree proof e2e decision was '$decision' (want true or false); browser lanes must succeed" ;;
          esac
          for name in E2E_RESULT E2E_EVIDENCE_RESULT DETECTION_CORPUS_RESULT; do
            val="${!name:-}"
            if [ "$val" = success ]; then
              continue
            elif [ "$val" = skipped ] && [ "$decision" = false ]; then
              echo "$name skipped: no browser paths changed"
            elif [ "$decision" = false ]; then
              reject "$name was '$val' (want success or skipped)"
            else
              reject "$name was '$val' (want success)"
            fi
          done
          exit "$status"

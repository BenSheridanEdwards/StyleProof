name: CI

on:
  pull_request:
  push:
    branches: [main]

# Library CI only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ESLint 10's formatter uses newer Node APIs when printing findings. Keep
      # runtime support proven on every Node version, but run lint/format once on
      # the supported toolchain.
      - name: Lint
        if: matrix.node == '22'
        run: npm run lint

      - name: Format check
        if: matrix.node == '22'
        run: npm run format:check
      - name: Privacy check
        if: matrix.node == '22'
        run: npm run privacy:check

      # Fail the build on a known high/critical-severity vulnerability in the
      # dependency tree. Runs once on the supported toolchain, like lint/format.
      - name: Dependency audit
        if: matrix.node == '22'
        run: npm audit --audit-level=high

      # The committed demo report (docs/demo/) must match what the current report
      # renderer produces — so every PR shows the REAL report, never a stale one.
      # Deterministic synthetic inputs, so this is gate-safe on one Node version.
      - name: Demo report up to date
        if: matrix.node == '22'
        run: node scripts/demo-report.mjs --check

      - name: Unit tests
        # Build already emitted and typechecked this exact checkout above.
        run: npm run test:unit

  # Run the complete browser and determinism path beside the Node matrix instead
  # of placing it after every Node 22 static and unit gate.
  e2e:
    name: e2e (node 22, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The one place the browser capture path (page.evaluate + CDP) is
      # exercised — a self-contained file:// fixture, no live server. The
      # Node-sensitive paths remain covered by units on 18, 20, and 22.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Browser shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .styleproof/ci/shard.json
          STYLEPROOF_DETERMINISM_RECEIPT: .styleproof/ci/determinism-oracle.json
        run: npx playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/2 --reporter=line,json

      - name: Upload browser shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: .styleproof/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  e2e-evidence:
    name: e2e (node 22)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect full browser inventory
        run: |
          mkdir -p .styleproof/ci
          npx playwright test --config=playwright.ci.config.ts --list --reporter=json > .styleproof/ci/inventory.json
      - uses: actions/download-artifact@v6
        with:
          pattern: e2e-shard-*
          path: .styleproof/ci/shards
      - name: Verify complete browser evidence and print determinism oracle receipt
        run: node scripts/verify-e2e-shards.mjs .styleproof/ci/inventory.json .styleproof/ci/shards
      - name: Upload verified browser evidence
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-node-22
          path: .styleproof/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  cli-smoke:
    name: cli smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node --test test/package-smoke.test.mjs

  # Stable branch-protection context. Internal jobs may evolve, but this check
  # fails unless every required CI evidence lane completed successfully.
  required:
    name: required
    if: always()
    needs: [build, e2e, e2e-evidence, cli-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI evidence
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_EVIDENCE_RESULT: ${{ needs.e2e-evidence.result }}
          CLI_SMOKE_RESULT: ${{ needs.cli-smoke.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          test "$E2E_EVIDENCE_RESULT" = success
          test "$CLI_SMOKE_RESULT" = success

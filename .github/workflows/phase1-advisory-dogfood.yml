name: Phase 1 advisory dogfood

# Thin hosted wire for Phase 1 mapping proof (#668 / #673).
# Exercises real capture → diff → report via the foundation harness (#669).
#
# Gate: job `Phase 1 mapping (advisory)` in this workflow.
# Advisory — NOT part of the hosted `required` check. Soft-pass: HOLD — the job
# fails closed when mapping is wrong or evidence is incomplete; it does not
# soft-pass incomplete mapping or bypass merge protection.
#
# Sibling Phase 1 specs (noop #671, extra harness #672) plug into
# PHASE1_MAPPING_SPECS after they land — same job, no redesign.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-advisory-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Phase 1 dogfood tree proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dogfood: ${{ steps.decide.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: decide
        run: node scripts/browser-lanes.mjs --github

  phase1-mapping:
    name: Phase 1 mapping (advisory)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dogfood != 'false' }}
    runs-on: ubuntu-latest
    env:
      PHASE1_MAPPING_SPECS: test/phase1-foundation-harness.e2e.spec.ts test/phase1-structure-harness.e2e.spec.ts
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browsers (cache hit, no OS deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium

      - name: Assert soft-pass HOLD is declared in Phase 1 oracles
        run: |
          grep -F 'HOLD' example/demo/phase1-css-delta.json
          grep -F 'HOLD' example/demo/phase1-structure-delta.json

      - name: Run Phase 1 mapping proof (capture → diff → report)
        run: pnpm exec playwright test $PHASE1_MAPPING_SPECS --reporter=line

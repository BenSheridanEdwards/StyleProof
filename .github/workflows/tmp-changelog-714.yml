name: tmp-changelog-714
on:
  push:
    branches: [prepare/7.0.2]
    paths:
      - "docs/_tmp_714_changelog.patch"
      - ".github/workflows/tmp-changelog-714.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tmp-changelog-714
  cancel-in-progress: true
jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare/7.0.2
      - name: Apply tip-delta patch, commit, self-clean
        run: |
          set -euo pipefail
          test -f docs/_tmp_714_changelog.patch
          patch -p1 --forward --batch -i docs/_tmp_714_changelog.patch
          grep -q '^## \[7\.0\.2\]' CHANGELOG.md
          wc -c CHANGELOG.md
          rm -f docs/_tmp_714_changelog.patch
          rm -f .github/workflows/tmp-changelog-714.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git add -A docs/_tmp_714_changelog.patch .github/workflows/tmp-changelog-714.yml
          git status
          git commit -m "docs(changelog): fold tip-delta into [7.0.2] (#714)"
          git push

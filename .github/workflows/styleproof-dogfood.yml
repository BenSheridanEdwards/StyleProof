name: StyleProof dogfood

# Live StyleProof-on-StyleProof. Captures the surfaces declared in
# styleproof.config.ts (example/styleproof.spec.ts → example/demo) and runs
# the Action in advisory mode — the adopter path.
#
# action-dogfood.yml remains the synthetic Action contract suite. This
# workflow is advisory and is NOT part of the hosted `required` check.

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: styleproof-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  styleproof-dogfood:
    name: StyleProof dogfood (advisory)
    # Forks lack write permission for map/report branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pin the checkout to the PR head commit
        run: git checkout --force '${{ github.event.pull_request.head.sha }}'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browsers (cache hit, no OS deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Define runner-local map path
        run: echo "MAP_ROOT=$RUNNER_TEMP/styleproof-dogfood" >> "$GITHUB_ENV"

      - name: Capture declared surfaces at the PR head
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PATH="$PWD/node_modules/.bin:$PATH" node bin/styleproof-map.mjs \
            --spec example/styleproof.spec.ts \
            --dir head --base-dir "$MAP_ROOT" \
            --sha "$HEAD_SHA" --upload \
            -- --config example/store-dogfood.playwright.config.ts

      - name: Capture declared surfaces at the PR base
        run: |
          set -euo pipefail
          # Capture from the clean head checkout. Do not symlink node_modules/dist
          # into the worktree: .gitignore is `dist/` / `node_modules/` (directories
          # only), so those symlinks read as untracked dirt and --upload exits 2.
          # Do not load the worktree Playwright config either: Node resolves
          # @playwright/test from the config file's directory, and the worktree
          # has no node_modules. HEAD's config + STYLEPROOF_DEMO_ROOT serves
          # the base commit's example/demo instead.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_WT="$RUNNER_TEMP/styleproof-dogfood-base"
          git worktree add --detach "$BASE_WT" "$BASE_SHA"
          STYLEPROOF_DEMO_ROOT="$BASE_WT/example/demo" \
          PATH="$PWD/node_modules/.bin:$PATH" node bin/styleproof-map.mjs \
            --spec example/styleproof.spec.ts \
            --dir base --base-dir "$MAP_ROOT" \
            --sha "$BASE_SHA" --upload \
            -- --config example/store-dogfood.playwright.config.ts
          git worktree remove --force "$BASE_WT"

      - id: dogfood
        uses: ./
        env:
          STYLEPROOF_PRODUCT_STATE: example/styleproof.product-state.json
        with:
          baseline-dir: ${{ runner.temp }}/styleproof-dogfood/base
          fresh-dir: ${{ runner.temp }}/styleproof-dogfood/head
          fail-on-diff: 'false'
          mode: 'advisory'
          status-context: 'StyleProof dogfood'
          comment-marker: '<!-- styleproof-dogfood-report -->'

      - name: Assert live declare-or-fail-closed ledger is armed
        run: |
          set -euo pipefail
          test -f example/styleproof.product-state.json
          grep -F '"home"' example/styleproof.product-state.json
          grep -E 'declared legacy pair' styleproof-report/report.md
          grep -F 'advisory, not certification' styleproof-report/report.md
          grep -F '"armed": true' styleproof-report/report.json
          grep -E 'home@' styleproof-report/report.json

      - name: Assert PR report was published as a workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAP_BRANCH: styleproof-maps
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # report-storage: artifact (the default) — the comment links the report
          # artifact on this run, and nothing lands on a report branch. The
          # artifact name follows comment-marker: styleproof-dogfood-report.
          body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq 'map(select(.body | contains("<!-- styleproof-dogfood-report -->"))) | last | .body // ""')"
          printf '%s\n' "$body" | grep -F '<!-- styleproof-dogfood-report -->'
          printf '%s\n' "$body" | grep -Eq "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          for i in 1 2 3 4 5; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[].name' | grep -Fx "styleproof-dogfood-report-pr-${PR_NUMBER}" && break
            if [ "$i" -eq 5 ]; then
              echo "StyleProof report artifact missing on run ${GITHUB_RUN_ID}" >&2
              exit 1
            fi
            sleep $((i * 2))
          done

          # Store layout is <sha>/<compatibilityKey>/styleproof-manifest.json
          # (uploadMapsToStore). The SHA root is a directory listing, not the manifest.
          for i in 1 2 3 4 5; do
            compat="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${HEAD_SHA}?ref=${MAP_BRANCH}" --jq 'map(select(.type=="dir"))[0].name // empty' || true)"
            if [ -n "$compat" ]; then
              map_path="${HEAD_SHA}/${compat}/styleproof-manifest.json"
              if gh api "repos/${GITHUB_REPOSITORY}/contents/${map_path}?ref=${MAP_BRANCH}" --jq .path | grep -Fx "$map_path"; then
                exit 0
              fi
            fi
            sleep $((i * 2))
          done
          echo "StyleProof map bundle missing at ${MAP_BRANCH}/${HEAD_SHA}/<compatibilityKey>/styleproof-manifest.json" >&2
          exit 1

      - name: Read the report artifact back like the approval workflow
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            // Hosted proof of the approval readback path (#696): the same
            // list → download → zip-read → receipt sequence the reusable
            // approval workflow runs, executed against a real artifact on a
            // real run. readZipEntry must stay byte-identical to the copies in
            // styleproof-approve-reusable.yml and example/styleproof-approve.yml
            // — test/styleproof-dogfood.test.mjs pins all three.
            const readZipEntry = async (zip, name) => {
              const { inflateRawSync } = await import('node:zlib');
              if (!Buffer.isBuffer(zip) || zip.length < 22) return null;
              let eocd = -1;
              for (let i = zip.length - 22; i >= 0 && i >= zip.length - 65558; i--) {
                if (zip.readUInt32LE(i) === 0x06054b50) { eocd = i; break; }
              }
              if (eocd < 0) return null;
              const entries = zip.readUInt16LE(eocd + 10);
              let offset = zip.readUInt32LE(eocd + 16);
              for (let i = 0; i < entries; i++) {
                if (offset + 46 > zip.length || zip.readUInt32LE(offset) !== 0x02014b50) return null;
                const method = zip.readUInt16LE(offset + 10);
                const compressedSize = zip.readUInt32LE(offset + 20);
                const nameLength = zip.readUInt16LE(offset + 28);
                const extraLength = zip.readUInt16LE(offset + 30);
                const commentLength = zip.readUInt16LE(offset + 32);
                const localOffset = zip.readUInt32LE(offset + 42);
                if (zip.toString('utf8', offset + 46, offset + 46 + nameLength) === name) {
                  if (localOffset + 30 > zip.length || zip.readUInt32LE(localOffset) !== 0x04034b50) return null;
                  const dataStart = localOffset + 30 + zip.readUInt16LE(localOffset + 26) + zip.readUInt16LE(localOffset + 28);
                  if (dataStart + compressedSize > zip.length) return null;
                  const data = zip.subarray(dataStart, dataStart + compressedSize);
                  if (method === 8) return inflateRawSync(data, { maxOutputLength: 64 * 1024 * 1024 }).toString('utf8');
                  if (method === 0) return data.toString('utf8');
                  return null;
                }
                offset += 46 + nameLength + extraLength + commentLength;
              }
              return null;
            };
            // The approval readback also pins the uploaded bytes (#702): the
            // report comment carries the upload's SHA-256 digest exactly once,
            // and the downloaded zip must hash to it.
            const marker = '<!-- styleproof-dogfood-report -->';
            const threadComments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100,
            });
            const dogfoodComments = threadComments.filter((c) => (c.body || '').includes(marker));
            if (dogfoodComments.length !== 1) {
              throw new Error(`expected exactly one ${marker} comment, found ${dogfoodComments.length}`);
            }
            const digestMarkers = dogfoodComments[0].body.match(/<!-- styleproof-artifact-digest:/g) || [];
            const digestMatches = [...dogfoodComments[0].body.matchAll(
              /<!-- styleproof-artifact-digest:sha256:([0-9a-f]{64}) -->/g,
            )];
            if (digestMarkers.length !== 1 || digestMatches.length !== 1) {
              throw new Error('the report comment does not carry exactly one well-formed artifact digest');
            }
            const expectedDigest = digestMatches[0][1];
            const artifactName = `styleproof-dogfood-report-pr-${process.env.PR_NUMBER}`;
            const listed = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: Number(process.env.GITHUB_RUN_ID), per_page: 100 },
            );
            const matches = (listed || []).filter((artifact) => artifact && artifact.name === artifactName);
            if (matches.length !== 1) {
              throw new Error(`expected exactly one ${artifactName} artifact on this run, found ${matches.length}`);
            }
            const download = await github.rest.actions.downloadArtifact({
              ...context.repo,
              artifact_id: matches[0].id,
              archive_format: 'zip',
            });
            const response = await fetch(download.url);
            if (!response || !response.ok) throw new Error('report artifact download did not succeed');
            const zip = Buffer.from(await response.arrayBuffer());
            const { createHash } = await import('node:crypto');
            if (createHash('sha256').update(zip).digest('hex') !== expectedDigest) {
              throw new Error('downloaded artifact does not hash to the comment digest');
            }
            const [publishedMarkdown, publishedJson] = await Promise.all([
              readZipEntry(zip, 'report.md'),
              readZipEntry(zip, 'report.json'),
            ]);
            if (!publishedMarkdown || !publishedJson) {
              throw new Error('report artifact does not contain report.md and report.json');
            }
            const receipts = [...publishedMarkdown.matchAll(
              /<!-- styleproof-receipt head-sha:([0-9a-f]{40}) run-id:(\d+) run-attempt:(\d+) -->/g,
            )];
            if (
              receipts.length !== 1 ||
              receipts[0][1] !== process.env.HEAD_SHA ||
              receipts[0][2] !== process.env.GITHUB_RUN_ID ||
              receipts[0][3] !== process.env.GITHUB_RUN_ATTEMPT
            ) {
              throw new Error('report.md receipt does not bind this head SHA, run, and attempt');
            }
            const parsed = JSON.parse(publishedJson);
            if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') {
              throw new Error('report.json is not a JSON object');
            }
            // Fail-closed probe: an absent entry must read null — never throw,
            // fabricate, or substitute content.
            if ((await readZipEntry(zip, 'no-such-entry.txt')) !== null) {
              throw new Error('zip reader did not fail closed on a missing entry');
            }

      - name: Label published report as live advisory dogfood
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const marker = '<!-- styleproof-dogfood-report -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const comment = [...comments].reverse().find(({ body }) => body?.includes(marker));
            if (!comment) throw new Error('Live StyleProof dogfood report comment was not found');

            const notice = [
              '> [!NOTE]',
              '> **Live StyleProof-on-StyleProof (advisory).** This report is captured from the surfaces declared in `styleproof.config.ts` (`example/demo`). The product-state ledger (`styleproof.product-state.json` / `productState.legacyPairs`) is armed: declared `home@*` pairs stay advisory; undeclared pairs fail closed. `fail-on-diff` is false; the check is not part of hosted required CI. The synthetic Action contract suite remains `action-dogfood.yml`.',
            ].join('\n');
            const body = comment.body ?? '';
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: comment.id,
              body: body.startsWith(notice) ? body : `${notice}\n\n${body}`,
            });

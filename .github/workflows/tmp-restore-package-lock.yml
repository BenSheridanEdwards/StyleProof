name: tmp-restore-package-lock
on:
  push:
    branches: [chore/prepare-7.0.1]
  workflow_dispatch:
jobs:
  restore:
    if: hashFiles('package-lock.json') == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/prepare-7.0.1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore package-lock.json from main at 7.0.1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const p = 'package-lock.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = '7.0.1';
          if (j.packages && j.packages['']) j.packages[''].version = '7.0.1';
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
          rm -f .github/workflows/tmp-restore-package-lock.yml
          git add package-lock.json
          git add -u .github/workflows/tmp-restore-package-lock.yml
          git commit -m "chore(release): restore package-lock.json for 7.0.1"
          git push origin HEAD:chore/prepare-7.0.1

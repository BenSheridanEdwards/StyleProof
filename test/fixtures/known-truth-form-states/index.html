<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Known-Truth Form States Fixture</title>
  <!--
    FIXTURE CONTRACT (documentation only — tests assert against expected.json)
    ===========================================================================
    This fixture declares exact CSS values for :disabled and :checked form
    element states. The expected.json oracle is the source of truth; these
    comments match the JSON.

    NOTE: Only properties that DIFFER from browser UA defaults are asserted.
    StyleProof prunes default-matching values to keep captures compact.

    ELEMENT: .btn-enabled (button) [data-testid="btn-enabled"]
      background-color: rgb(59, 130, 246)   [#3B82F6 blue-500]
      color: rgb(255, 255, 255)
      cursor: pointer
      opacity: 1

    ELEMENT: .btn-disabled (button[disabled]) [data-testid="btn-disabled"]
      :disabled CSS applies:
        background-color: rgb(148, 163, 184) [#94A3B8 slate-400]
        color: rgb(100, 116, 139)            [#64748B slate-500]
        cursor: not-allowed
        opacity: 1

    ELEMENT: .input-enabled (input) [data-testid="input-enabled"]
      background-color: rgb(255, 255, 255)
      border-top-color: rgb(59, 130, 246)
      border-right-color: rgb(59, 130, 246)
      border-bottom-color: rgb(59, 130, 246)
      border-left-color: rgb(59, 130, 246)
      color: rgb(17, 24, 39)                 [#111827 gray-900]

    ELEMENT: .input-disabled (input[disabled]) [data-testid="input-disabled"]
      :disabled CSS applies:
        background-color: rgb(241, 245, 249) [#F1F5F9 slate-100]
        border-top-color: rgb(203, 213, 225) [#CBD5E1 slate-300]
        border-right-color: rgb(203, 213, 225)
        border-bottom-color: rgb(203, 213, 225)
        border-left-color: rgb(203, 213, 225)
        color: rgb(148, 163, 184)            [#94A3B8 slate-400]

    ELEMENT: .checkbox-unchecked (input[type="checkbox"]) [data-testid="checkbox-unchecked"]
      accent-color: rgb(59, 130, 246)        [#3B82F6 blue-500]

    ELEMENT: .checkbox-checked (input[type="checkbox"][checked]) [data-testid="checkbox-checked"]
      :checked CSS applies:
        accent-color: rgb(34, 197, 94)       [#22C55E green-500]
  -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 32px;
    }

    .section {
      margin-bottom: 32px;
    }

    .label {
      display: block;
      font-size: 14px;
      color: rgb(71, 85, 105);
      margin-bottom: 8px;
    }

    /* === BUTTON STYLES === */
    .btn-enabled,
    .btn-disabled {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      margin-right: 16px;
    }

    .btn-enabled {
      background-color: rgb(59, 130, 246);
      color: rgb(255, 255, 255);
      cursor: pointer;
      opacity: 1;
    }

    .btn-disabled {
      background-color: rgb(148, 163, 184);
      color: rgb(100, 116, 139);
      cursor: not-allowed;
      opacity: 1;
    }

    /* === INPUT STYLES === */
    .input-enabled,
    .input-disabled {
      padding: 8px 12px;
      font-size: 16px;
      border-style: solid;
      border-width: 2px;
      margin-right: 16px;
    }

    .input-enabled {
      background-color: rgb(255, 255, 255);
      border-color: rgb(59, 130, 246);
      color: rgb(17, 24, 39);
    }

    .input-disabled {
      background-color: rgb(241, 245, 249);
      border-color: rgb(203, 213, 225);
      color: rgb(148, 163, 184);
    }

    /* === CHECKBOX STYLES === */
    .checkbox-unchecked,
    .checkbox-checked {
      width: 20px;
      height: 20px;
      margin-right: 16px;
    }

    .checkbox-unchecked {
      accent-color: rgb(59, 130, 246);
    }

    .checkbox-checked {
      accent-color: rgb(34, 197, 94);
    }
  </style>
</head>
<body>
  <main>
    <div class="section">
      <span class="label">Buttons (enabled vs :disabled)</span>
      <button class="btn-enabled" data-testid="btn-enabled">Enabled</button>
      <button class="btn-disabled" data-testid="btn-disabled" disabled>Disabled</button>
    </div>

    <div class="section">
      <span class="label">Inputs (enabled vs :disabled)</span>
      <input type="text" class="input-enabled" data-testid="input-enabled" placeholder="Enabled input">
      <input type="text" class="input-disabled" data-testid="input-disabled" placeholder="Disabled input" disabled>
    </div>

    <div class="section">
      <span class="label">Checkboxes (unchecked vs :checked)</span>
      <input type="checkbox" class="checkbox-unchecked" data-testid="checkbox-unchecked">
      <input type="checkbox" class="checkbox-checked" data-testid="checkbox-checked" checked>
    </div>
  </main>
</body>
</html>

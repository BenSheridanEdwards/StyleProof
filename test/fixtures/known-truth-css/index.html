<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Known-Truth CSS Fixture</title>
  <!--
    FIXTURE CONTRACT (documentation only — tests assert against expected.json)
    ===========================================================================
    This fixture declares exact CSS values that StyleProof MUST reproduce.
    The expected.json oracle is the source of truth; these comments match the JSON.

    NOTE: Only properties that DIFFER from browser UA defaults are asserted.
    StyleProof prunes default-matching values to keep captures compact.

    CUSTOM PROPERTIES (on :root, color-valued only captured):
      --primary-color: rgb(59, 130, 246)    [#3B82F6 blue]

    ELEMENT: .hero-container (div) [data-testid="hero"]
      background-color: rgb(248, 250, 252)  [#F8FAFC gray-50]
      padding-top: 32px
      padding-right: 32px
      padding-bottom: 32px
      padding-left: 32px
      box-sizing: border-box

    ELEMENT: .cta-button (button) [data-testid="cta"]
      RESTING:
        background-color: rgb(59, 130, 246)   [var(--primary-color)]
        color: rgb(255, 255, 255)
        padding-top: 12px
        padding-right: 24px
        padding-bottom: 12px
        padding-left: 24px
        font-size: 16px
        border-top-width: 0px
        border-right-width: 0px
        border-bottom-width: 0px
        border-left-width: 0px
        border-top-style: none
        border-right-style: none
        border-bottom-style: none
        border-left-style: none
        cursor: pointer
      :hover
        background-color: rgb(37, 99, 235)    [#2563EB blue-600]
        color: rgb(255, 255, 255)
      :focus
        outline-style: solid
        outline-color: rgb(59, 130, 246)
        outline-width: 2px
        outline-offset: 2px
      :active
        background-color: rgb(29, 78, 216)    [#1D4ED8 blue-700]

    ELEMENT: .label-span (span) [data-testid="label"]
      color: rgb(71, 85, 105)               [#475569 gray-600]
      font-size: 14px
      margin-left: 8px
      box-sizing: border-box

    ELEMENT: .text-input (input type=text) [data-testid="email"]
      RESTING:
        border-top-style: solid
        border-right-style: solid
        border-bottom-style: solid
        border-left-style: solid
        border-top-color: rgb(203, 213, 225)  [#CBD5E1 gray-300]
        border-right-color: rgb(203, 213, 225)
        border-bottom-color: rgb(203, 213, 225)
        border-left-color: rgb(203, 213, 225)
        padding-top: 8px
        padding-right: 12px
        padding-bottom: 8px
        padding-left: 12px
      :focus (delta from resting — only changed props captured)
        border-top-color: rgb(59, 130, 246)
        border-right-color: rgb(59, 130, 246)
        border-bottom-color: rgb(59, 130, 246)
        border-left-color: rgb(59, 130, 246)
        outline-style: solid
        outline-color: rgb(191, 219, 254)     [#BFDBFE blue-200]
        (outline-width: 3px not captured — matches browser input default)

    ELEMENT: .badge (span) [data-testid="badge"]
      RESTING:
        display: inline-block
        position: relative
        padding-left: 20px
        color: rgb(34, 197, 94)              [#22C55E green-500]
      ::before
        content: "✓"
        position: absolute
        left: 0px
        top: 0px
        color: rgb(34, 197, 94)              [#22C55E green-500]

    ELEMENT: .quote (blockquote) [data-testid="quote"]
      RESTING:
        position: relative
        padding-left: 24px
        padding-right: 24px
        font-style: italic
        color: rgb(100, 116, 139)            [#64748B slate-500]
      ::before
        content: "\201C" (left curly quote via CSS escape)
        position: absolute
        left: 0px
        top: 0px
        font-size: 32px
        color: rgb(203, 213, 225)            [#CBD5E1 gray-300]
      ::after
        content: "\201D" (right curly quote via CSS escape)
        position: absolute
        right: 0px
        bottom: 0px
        font-size: 32px
        color: rgb(203, 213, 225)            [#CBD5E1 gray-300]

    ELEMENT: .flex-layout (div) [data-testid="flex-layout"]
      display: flex
      flex-direction: row-reverse          [non-default: row is the UA default and is pruned]
      justify-content: space-between
      align-items: center
      column-gap: 12px
      row-gap: 12px

    ELEMENT: .grid-layout (div) [data-testid="grid-layout"]
      display: grid
      grid-template-columns: 120px 240px
      column-gap: 16px
      row-gap: 8px

    ELEMENT: .visual-box (div) [data-testid="visual-box"]
      border-top-left-radius: 14px
      border-top-right-radius: 6px
      border-bottom-right-radius: 10px
      border-bottom-left-radius: 4px
      box-shadow: rgb(15, 23, 42) 0px 4px 12px 0px

    ELEMENT: .transform-box (div) [data-testid="transform-box"]
      transform: matrix(1, 0, 0, 1, 12, 8)
      opacity: 0.65

    ELEMENT: .focus-visible-control (button) [data-testid="focus-visible-control"]
      RESTING:
        background-color: rgb(248, 250, 252)
      :focus
        outline-style: solid
        outline-color: rgb(37, 99, 235)
        outline-width: 4px                [non-default: medium=3px equals the rest baseline]
        outline-offset: 2px
      :focus-visible
        box-shadow: rgb(22, 163, 74) 0px 0px 0px 4px
      StyleProof's focus layer forces both :focus and :focus-visible. The focus
      oracle therefore contains the blue outline and green box shadow together.
  -->
  <style>
    :root {
      --primary-color: rgb(59, 130, 246);
      --spacing: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    .hero-container {
      background-color: rgb(248, 250, 252);
      padding: 32px;
    }

    .cta-button {
      background-color: var(--primary-color);
      color: rgb(255, 255, 255);
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .cta-button:hover {
      background-color: rgb(37, 99, 235);
      color: rgb(255, 255, 255);
    }

    .cta-button:focus {
      outline: 2px solid rgb(59, 130, 246);
      outline-offset: 2px;
    }

    .cta-button:active {
      background-color: rgb(29, 78, 216);
    }

    .label-span {
      color: rgb(71, 85, 105);
      font-size: 14px;
      margin-left: 8px;
    }

    .text-input {
      border: 2px solid rgb(203, 213, 225);
      padding: 8px 12px;
    }

    .text-input:focus {
      border-color: rgb(59, 130, 246);
      outline: 3px solid rgb(191, 219, 254);
    }

    .badge {
      display: inline-block;
      position: relative;
      padding-left: 20px;
      color: rgb(34, 197, 94);
    }

    .badge::before {
      content: "✓";
      position: absolute;
      left: 0px;
      top: 0px;
      color: rgb(34, 197, 94);
    }

    .quote {
      position: relative;
      padding-left: 24px;
      padding-right: 24px;
      font-style: italic;
      color: rgb(100, 116, 139);
    }

    .quote::before {
      content: "\201C";
      position: absolute;
      left: 0px;
      top: 0px;
      font-size: 32px;
      color: rgb(203, 213, 225);
    }

    .quote::after {
      content: "\201D";
      position: absolute;
      right: 0px;
      bottom: 0px;
      font-size: 32px;
      color: rgb(203, 213, 225);
    }

    .flex-layout {
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-between;
      align-items: center;
      column-gap: 12px;
      row-gap: 12px;
      width: 360px;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 120px 240px;
      column-gap: 16px;
      row-gap: 8px;
    }

    .visual-box {
      border-top-left-radius: 14px;
      border-top-right-radius: 6px;
      border-bottom-right-radius: 10px;
      border-bottom-left-radius: 4px;
      box-shadow: rgb(15, 23, 42) 0px 4px 12px 0px;
    }

    .transform-box {
      transform: translate(12px, 8px);
      opacity: 0.65;
    }

    .focus-visible-control {
      background-color: rgb(248, 250, 252);
    }

    .focus-visible-control:focus {
      outline: 4px solid rgb(37, 99, 235);
      outline-offset: 2px;
    }

    .focus-visible-control:focus-visible {
      box-shadow: rgb(22, 163, 74) 0px 0px 0px 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="hero-container" data-testid="hero">
      <button class="cta-button" data-testid="cta">Get Started</button>
      <span class="label-span" data-testid="label">Free trial</span>
    </div>
    <div>
      <input type="text" class="text-input" data-testid="email" name="email" placeholder="Email">
    </div>
    <div>
      <span class="badge" data-testid="badge">Verified</span>
    </div>
    <blockquote class="quote" data-testid="quote">
      Design is not just what it looks like, design is how it works.
    </blockquote>
    <div class="flex-layout" data-testid="flex-layout"><span>Alpha</span><span>Beta</span></div>
    <div class="grid-layout" data-testid="grid-layout"><span>One</span><span>Two</span></div>
    <div class="visual-box" data-testid="visual-box">Visual box</div>
    <div class="transform-box" data-testid="transform-box">Transform box</div>
    <button class="focus-visible-control" data-testid="focus-visible-control">Focus contract</button>
  </main>
</body>
</html>

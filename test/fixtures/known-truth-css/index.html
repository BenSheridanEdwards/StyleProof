<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Known-Truth CSS Fixture</title>
  <!--
    FIXTURE CONTRACT (documentation only — tests assert against expected.json)
    ===========================================================================
    This fixture declares exact CSS values that StyleProof MUST reproduce.
    The expected.json oracle is the source of truth; these comments match the JSON.

    NOTE: Only properties that DIFFER from browser UA defaults are asserted.
    StyleProof prunes default-matching values to keep captures compact.

    CUSTOM PROPERTIES (on :root, color-valued only captured):
      --primary-color: rgb(59, 130, 246)    [#3B82F6 blue]

    ELEMENT: .hero-container (div) [data-testid="hero"]
      background-color: rgb(248, 250, 252)  [#F8FAFC gray-50]
      padding-top: 32px
      padding-right: 32px
      padding-bottom: 32px
      padding-left: 32px
      box-sizing: border-box

    ELEMENT: .cta-button (button) [data-testid="cta"]
      RESTING:
        background-color: rgb(59, 130, 246)   [var(--primary-color)]
        color: rgb(255, 255, 255)
        padding-top: 12px
        padding-right: 24px
        padding-bottom: 12px
        padding-left: 24px
        font-size: 16px
        border-top-width: 0px
        border-right-width: 0px
        border-bottom-width: 0px
        border-left-width: 0px
        border-top-style: none
        border-right-style: none
        border-bottom-style: none
        border-left-style: none
        cursor: pointer
      :hover
        background-color: rgb(37, 99, 235)    [#2563EB blue-600]
        color: rgb(255, 255, 255)
      :focus
        outline-style: solid
        outline-color: rgb(59, 130, 246)
        outline-width: 2px
        outline-offset: 2px
      :active
        background-color: rgb(29, 78, 216)    [#1D4ED8 blue-700]

    PRODUCT SEAM (:focus vs :focus-visible)
      Capture forces :focus and :focus-visible together and stores the delta
      under the single "focus" layer. The oracle still declares distinct
      contracts. Unique property values make a wrong-state force fail-closed.

    ELEMENT: .pointer-ring (button) [data-testid="pointer-ring"]
      RESTING:
        background-color: rgb(255, 255, 255)
        color: rgb(15, 23, 42)
        cursor: pointer
      :focus (pointer-focus only — no :focus-visible rule)
        background-color: rgb(219, 234, 254)
        outline-style: solid
        outline-color: rgb(37, 99, 235)
        outline-width: 4px
        outline-offset: 2px

    ELEMENT: .keyboard-ring (button) [data-testid="keyboard-ring"]
      RESTING:
        background-color: rgb(255, 255, 255)
        color: rgb(15, 23, 42)
        cursor: pointer
      :focus-visible (keyboard-focus only — no :focus rule)
        box-shadow: rgb(234, 179, 8) 0px 0px 0px 4px
        outline-style: dashed
        outline-color: rgb(202, 138, 4)
        outline-width: 5px
        outline-offset: 6px

    ELEMENT: .dual-ring (button) [data-testid="dual-ring"]
      RESTING:
        background-color: rgb(255, 255, 255)
        color: rgb(15, 23, 42)
        cursor: pointer
      :focus (unique signature — must appear when :focus is forced)
        background-color: rgb(224, 231, 255)
      :focus-visible (unique signature — must appear when :focus-visible is forced)
        box-shadow: rgb(251, 191, 36) 0px 0px 0px 4px
        outline-offset: 8px

    ELEMENT: .label-span (span) [data-testid="label"]
      color: rgb(71, 85, 105)               [#475569 gray-600]
      font-size: 14px
      margin-left: 8px
      box-sizing: border-box

    ELEMENT: .text-input (input type=text) [data-testid="email"]
      RESTING:
        border-top-style: solid
        border-right-style: solid
        border-bottom-style: solid
        border-left-style: solid
        border-top-color: rgb(203, 213, 225)  [#CBD5E1 gray-300]
        border-right-color: rgb(203, 213, 225)
        border-bottom-color: rgb(203, 213, 225)
        border-left-color: rgb(203, 213, 225)
        padding-top: 8px
        padding-right: 12px
        padding-bottom: 8px
        padding-left: 12px
      :focus (delta from resting — only changed props captured)
        border-top-color: rgb(59, 130, 246)
        border-right-color: rgb(59, 130, 246)
        border-bottom-color: rgb(59, 130, 246)
        border-left-color: rgb(59, 130, 246)
        outline-style: solid
        outline-color: rgb(191, 219, 254)     [#BFDBFE blue-200]
        (outline-width: 3px not captured — matches browser input default)

    ELEMENT: .badge (span) [data-testid="badge"]
      RESTING:
        display: inline-block
        position: relative
        padding-left: 20px
        color: rgb(34, 197, 94)              [#22C55E green-500]
      ::before
        content: "✓"
        position: absolute
        left: 0px
        top: 0px
        color: rgb(34, 197, 94)              [#22C55E green-500]

    ELEMENT: .quote (blockquote) [data-testid="quote"]
      RESTING:
        position: relative
        padding-left: 24px
        padding-right: 24px
        font-style: italic
        color: rgb(100, 116, 139)            [#64748B slate-500]
      ::before
        content: "\201C" (left curly quote via CSS escape)
        position: absolute
        left: 0px
        top: 0px
        font-size: 32px
        color: rgb(203, 213, 225)            [#CBD5E1 gray-300]
      ::after
        content: "\201D" (right curly quote via CSS escape)
        position: absolute
        right: 0px
        bottom: 0px
        font-size: 32px
        color: rgb(203, 213, 225)            [#CBD5E1 gray-300]
  -->
  <style>
    :root {
      --primary-color: rgb(59, 130, 246);
      --spacing: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    .hero-container {
      background-color: rgb(248, 250, 252);
      padding: 32px;
    }

    .cta-button {
      background-color: var(--primary-color);
      color: rgb(255, 255, 255);
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .cta-button:hover {
      background-color: rgb(37, 99, 235);
      color: rgb(255, 255, 255);
    }

    .cta-button:focus {
      outline: 2px solid rgb(59, 130, 246);
      outline-offset: 2px;
    }

    .cta-button:active {
      background-color: rgb(29, 78, 216);
    }

    .pointer-ring,
    .keyboard-ring,
    .dual-ring {
      background-color: rgb(255, 255, 255);
      color: rgb(15, 23, 42);
      padding: 8px 16px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .pointer-ring:focus {
      background-color: rgb(219, 234, 254);
      outline-style: solid;
      outline-color: rgb(37, 99, 235);
      outline-width: 4px;
      outline-offset: 2px;
    }

    .keyboard-ring:focus-visible {
      box-shadow: 0 0 0 4px rgb(234, 179, 8);
      outline-style: dashed;
      outline-color: rgb(202, 138, 4);
      outline-width: 5px;
      outline-offset: 6px;
    }

    .dual-ring:focus {
      background-color: rgb(224, 231, 255);
    }

    .dual-ring:focus-visible {
      box-shadow: 0 0 0 4px rgb(251, 191, 36);
      outline-offset: 8px;
    }

    .label-span {
      color: rgb(71, 85, 105);
      font-size: 14px;
      margin-left: 8px;
    }

    .text-input {
      border: 2px solid rgb(203, 213, 225);
      padding: 8px 12px;
    }

    .text-input:focus {
      border-color: rgb(59, 130, 246);
      outline: 3px solid rgb(191, 219, 254);
    }

    .badge {
      display: inline-block;
      position: relative;
      padding-left: 20px;
      color: rgb(34, 197, 94);
    }

    .badge::before {
      content: "✓";
      position: absolute;
      left: 0px;
      top: 0px;
      color: rgb(34, 197, 94);
    }

    .quote {
      position: relative;
      padding-left: 24px;
      padding-right: 24px;
      font-style: italic;
      color: rgb(100, 116, 139);
    }

    .quote::before {
      content: "\201C";
      position: absolute;
      left: 0px;
      top: 0px;
      font-size: 32px;
      color: rgb(203, 213, 225);
    }

    .quote::after {
      content: "\201D";
      position: absolute;
      right: 0px;
      bottom: 0px;
      font-size: 32px;
      color: rgb(203, 213, 225);
    }
  </style>
</head>
<body>
  <main>
    <div class="hero-container" data-testid="hero">
      <button class="cta-button" data-testid="cta">Get Started</button>
      <span class="label-span" data-testid="label">Free trial</span>
      <button class="pointer-ring" data-testid="pointer-ring" type="button">Pointer focus</button>
      <button class="keyboard-ring" data-testid="keyboard-ring" type="button">Keyboard focus</button>
      <button class="dual-ring" data-testid="dual-ring" type="button">Dual focus</button>
    </div>
    <div>
      <input type="text" class="text-input" data-testid="email" name="email" placeholder="Email">
    </div>
    <div>
      <span class="badge" data-testid="badge">Verified</span>
    </div>
    <blockquote class="quote" data-testid="quote">
      Design is not just what it looks like, design is how it works.
    </blockquote>
  </main>
</body>
</html>

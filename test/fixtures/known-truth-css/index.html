<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Known-Truth CSS Fixture</title>
  <!--
    FIXTURE CONTRACT (documentation only — tests assert against expected.json)
    ===========================================================================
    This fixture declares exact CSS values that StyleProof MUST reproduce.
    The expected.json oracle is the source of truth; these comments match the JSON.

    NOTE: Only properties that DIFFER from browser UA defaults are asserted.
    StyleProof prunes default-matching values to keep captures compact.

    CUSTOM PROPERTIES (on :root, color-valued only captured):
      --primary-color: rgb(59, 130, 246)    [#3B82F6 blue]

    ELEMENT: .hero-container (div) [data-testid="hero"]
      background-color: rgb(248, 250, 252)  [#F8FAFC gray-50]
      padding-top: 32px
      padding-right: 32px
      padding-bottom: 32px
      padding-left: 32px
      box-sizing: border-box

    ELEMENT: .cta-button (button) [data-testid="cta"]
      RESTING:
        background-color: rgb(59, 130, 246)   [var(--primary-color)]
        color: rgb(255, 255, 255)
        padding-top: 12px
        padding-right: 24px
        padding-bottom: 12px
        padding-left: 24px
        font-size: 16px
        border-top-width: 0px
        border-right-width: 0px
        border-bottom-width: 0px
        border-left-width: 0px
        border-top-style: none
        border-right-style: none
        border-bottom-style: none
        border-left-style: none
        cursor: pointer
      :hover
        background-color: rgb(37, 99, 235)    [#2563EB blue-600]
        color: rgb(255, 255, 255)
      :focus
        outline-style: solid
        outline-color: rgb(59, 130, 246)
        outline-width: 2px
        outline-offset: 2px
      :active
        background-color: rgb(29, 78, 216)    [#1D4ED8 blue-700]

    ELEMENT: .label-span (span) [data-testid="label"]
      color: rgb(71, 85, 105)               [#475569 gray-600]
      font-size: 14px
      margin-left: 8px
      box-sizing: border-box

    ELEMENT: .text-input (input type=text) [data-testid="email"]
      RESTING:
        border-top-style: solid
        border-right-style: solid
        border-bottom-style: solid
        border-left-style: solid
        border-top-color: rgb(203, 213, 225)  [#CBD5E1 gray-300]
        border-right-color: rgb(203, 213, 225)
        border-bottom-color: rgb(203, 213, 225)
        border-left-color: rgb(203, 213, 225)
        padding-top: 8px
        padding-right: 12px
        padding-bottom: 8px
        padding-left: 12px
      :focus (delta from resting — only changed props captured)
        border-top-color: rgb(59, 130, 246)
        border-right-color: rgb(59, 130, 246)
        border-bottom-color: rgb(59, 130, 246)
        border-left-color: rgb(59, 130, 246)
        outline-style: solid
        outline-color: rgb(191, 219, 254)     [#BFDBFE blue-200]
        (outline-width: 3px not captured — matches browser input default)
  -->
  <style>
    :root {
      --primary-color: rgb(59, 130, 246);
      --spacing: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    .hero-container {
      background-color: rgb(248, 250, 252);
      padding: 32px;
    }

    .cta-button {
      background-color: var(--primary-color);
      color: rgb(255, 255, 255);
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .cta-button:hover {
      background-color: rgb(37, 99, 235);
      color: rgb(255, 255, 255);
    }

    .cta-button:focus {
      outline: 2px solid rgb(59, 130, 246);
      outline-offset: 2px;
    }

    .cta-button:active {
      background-color: rgb(29, 78, 216);
    }

    .label-span {
      color: rgb(71, 85, 105);
      font-size: 14px;
      margin-left: 8px;
    }

    .text-input {
      border: 2px solid rgb(203, 213, 225);
      padding: 8px 12px;
    }

    .text-input:focus {
      border-color: rgb(59, 130, 246);
      outline: 3px solid rgb(191, 219, 254);
    }
  </style>
</head>
<body>
  <main>
    <div class="hero-container" data-testid="hero">
      <button class="cta-button" data-testid="cta">Get Started</button>
      <span class="label-span" data-testid="label">Free trial</span>
    </div>
    <div>
      <input type="text" class="text-input" data-testid="email" name="email" placeholder="Email">
    </div>
  </main>
</body>
</html>

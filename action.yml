name: 'styleproof report'
description: >-
  Diff two StyleProof capture directories, publish a compact side-by-side report
  to an orphan branch, and post a compact summary and one commit-bound report link
  to the PR. Crops remain relative files in the committed report for both public
  and private repositories.
branding:
  icon: 'layers'
  color: 'blue'

inputs:
  baseline-dir:
    description: 'Directory with restored or freshly captured base-branch maps (.json.gz + .png).'
    required: true
  fresh-dir:
    description: 'Directory with restored or freshly captured PR-head maps to compare (.json.gz + .png).'
    required: true
  include-content:
    description: 'Render advisory content and DOM-structure evidence in the durable report. This evidence never changes the style gate verdict.'
    default: 'false'
  require-state-identity:
    description: 'Require explicit matching product-state identity on every paired capture. Missing, malformed, or mismatched identity is non-certifying and cannot be approved.'
    default: 'false'
  base-capture-failed:
    description: 'Set true when the baseline capture failed with zero maps and baseline-dir is intentionally bare. Partial baselines with tolerated per-surface failures keep this false. Produces DEGRADED_BASELINE when true.'
    default: 'false'
  report-branch:
    description: 'Orphan branch that stores reports (created on first run). One pr-<n>/ folder per PR; the styleproof-init workflow prunes each on PR close.'
    default: 'styleproof-reports'
  github-token:
    description: 'Token used to push the report branch and post the PR comment.'
    default: ${{ github.token }}
  fail-on-diff:
    description: 'Certify mode: fail the job when any difference is found. Ignored when require-approval is true.'
    default: 'true'
  require-approval:
    description: >-
      Review-gate mode. Instead of failing the job, set a `StyleProof` commit
      status (red until a write-access reviewer ticks the approval box in the
      report comment, green when there are no reviewable style changes). Pair with the
      styleproof-approve workflow (see README) and a branch-protection rule that
      requires the `StyleProof` status.
    default: 'false'
  status-context:
    description: 'Name of the commit status set in review-gate mode (must match the approve workflow + branch protection).'
    default: 'StyleProof'

outputs:
  changed:
    description: >-
      "true" when style review is required: a semantically matched element changed
      computed style, pseudo-element, or forced state; or a surface was added or
      removed and must be reviewed before changing the baseline.
    value: ${{ steps.verdict.outputs.reviewable-changed }}
  report-url:
    description: 'Blob URL of the durable report receipt for this run.'
    value: ${{ steps.publish.outputs.url }}
  trust-state:
    description: >-
      Machine-readable terminal classification: NO_REVIEWABLE_STYLE_CHANGES,
      STYLE_REVIEW_REQUIRED, DATA_RESIDUE_UNACKNOWLEDGED,
      INVENTORY_REMOVAL_UNACKNOWLEDGED, CERTIFICATION_FAILED,
      PARTIAL_BASELINE, DEGRADED_BASELINE, or REPORT_PUBLICATION_FAILED.
    value: ${{ steps.trust.outputs.state }}
  content-changes:
    description: 'Number of advisory content/structure changes rendered; 0 when none were found or content evaluation was disabled.'
    value: ${{ steps.report.outputs.content-changes }}
  data-residue-keys:
    description: 'JSON array of unacknowledged <surface>·<endpoint> residue keys.'
    value: ${{ steps.verdict.outputs.data-residue-keys }}

runs:
  using: composite
  steps:
    # Composite actions run from a checked-out action ref, but bare `npx
    # styleproof-*` resolves from the consumer workspace or npm latest. Install and
    # build this action checkout, then run the checked-out bins so `uses: ...@v6`
    # truly executes v6 code even though `dist/` is not committed to git. The
    # checkout-bound stamp is job-local by design: never publish or cache it.
    - name: Install StyleProof action runtime
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"

        runtime_identity="$(node -e "const fs=require('node:fs');const {createHash}=require('node:crypto');const h=createHash('sha256');h.update(process.env.GITHUB_ACTION_PATH ?? '');h.update('\\0');h.update(process.env.GITHUB_SHA ?? '');h.update('\\0');h.update(fs.readFileSync('package-lock.json'));process.stdout.write(h.digest('hex'))")"
        runtime_stamp="$RUNNER_TEMP/styleproof-action-runtime-${runtime_identity}.stamp"
        if [ -f "$runtime_stamp" ] && [ ! -L "$runtime_stamp" ] && [ "$(cat "$runtime_stamp")" = "$runtime_identity" ]; then
          exit 0
        fi

        rm -f -- "$runtime_stamp"
        npm ci --ignore-scripts
        npm run build

        runtime_stamp_tmp="${runtime_stamp}.tmp.$$"
        trap 'rm -f -- "$runtime_stamp_tmp"' EXIT
        printf '%s\n' "$runtime_identity" > "$runtime_stamp_tmp"
        mv -f -- "$runtime_stamp_tmp" "$runtime_stamp"
        trap - EXIT

    # Resolve the PR number + head SHA from the TRUSTED event payload. This is what
    # lets the report be driven from a `workflow_run` (the fork/Dependabot-safe flow:
    # capture under the read-only `pull_request` token, then comment + set the status
    # here under a write token) as well as directly from `pull_request`.
    #
    # Identity is taken only from data GitHub sets — never from the (untrusted)
    # capture artifact — so a fork can't spoof which PR/commit the privileged status
    # lands on. `workflow_run.head_sha` is the real captured commit; the PR is its
    # `pull_requests` association (same-repo, incl. Dependabot) or, for forks, the
    # open PR whose head IS that exact commit.
    - id: context
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        retries: 3
        script: |
          const { resolveActionContext } = await import(`${process.env.GITHUB_ACTION_PATH}/dist/action-context.js`);
          const { prNumber, baseSha, headSha } = await resolveActionContext({
            eventName: context.eventName,
            payload: context.payload,
            repo: context.repo,
            github,
          });
          // Emit the complete tuple together or nothing, so no later step can run on partial provenance.
          const resolved = Boolean(prNumber) && Boolean(baseSha) && Boolean(headSha);
          core.setOutput('pr-number', resolved ? prNumber : '');
          core.setOutput('base-sha', resolved ? baseSha : '');
          core.setOutput('head-sha', resolved ? headSha : '');
          if (!resolved) {
            core.info('StyleProof: no PR context resolved — comment/status steps will be skipped.');
          }

    # Policy config: an optional styleproof.config.json at the consumer repo root.
    # Today it carries one setting — `blocking` — but it's the home for future gate
    # policy. Absent → all defaults (blocking on; opt out with "blocking": false);
    # malformed policy fails loudly. Inputs stay the home for plumbing (dirs, token, mode);
    # the config file is the home for policy.
    - id: config
      uses: actions/github-script@v9
      with:
        script: |
          const { loadStyleProofConfig } = await import(`${process.env.GITHUB_ACTION_PATH}/dist/config.js`);
          const root = process.env.GITHUB_WORKSPACE || '.';
          const cfg = loadStyleProofConfig(root);
          core.info('StyleProof: loaded styleproof.config.json policy (or defaults when absent)');
          core.setOutput('blocking', cfg.blocking === false ? 'false' : 'true');
          // A removed navigable affordance (a route/tab/menu-item the UI stopped offering)
          // is a feature going unreachable — high-stakes, and NOT something the style
          // "approve all" box should wave through. It hard-fails unless the removal is
          // recorded in styleproof.inventory.json. On by default; set
          // "gateInventoryRemovals": false to opt out.
          core.setOutput('gate-inventory-removals', cfg.gateInventoryRemovals === false ? 'false' : 'true');

    - id: diff
      shell: bash
      env:
        STYLEPROOF_REQUIRE_STATE_IDENTITY: ${{ inputs.require-state-identity }}
        STYLEPROOF_EXPECTED_BASE_SHA: ${{ steps.context.outputs.base-sha }}
        STYLEPROOF_EXPECTED_HEAD_SHA: ${{ steps.context.outputs.head-sha }}
      run: |
        state_identity_arguments=()
        case "$STYLEPROOF_REQUIRE_STATE_IDENTITY" in
          true) state_identity_arguments+=(--require-state-identity) ;;
          false) ;;
          *) echo "require-state-identity must be true or false" >&2; exit 2 ;;
        esac
        if [ -z "$STYLEPROOF_EXPECTED_BASE_SHA" ] || [ -z "$STYLEPROOF_EXPECTED_HEAD_SHA" ]; then
          echo "StyleProof: trusted base/head SHA context is required for certification" >&2
          exit 2
        fi
        trusted_sha_arguments=(
          --expected-before-sha "$STYLEPROOF_EXPECTED_BASE_SHA"
          --expected-after-sha "$STYLEPROOF_EXPECTED_HEAD_SHA"
        )
        set +e
        node "$GITHUB_ACTION_PATH/bin/styleproof-diff.mjs" "${{ inputs.baseline-dir }}" "${{ inputs.fresh-dir }}" --max=200 --json styleproof-diff.json ${trusted_sha_arguments[@]+"${trusted_sha_arguments[@]}"} ${state_identity_arguments[@]+"${state_identity_arguments[@]}"} | tee styleproof-diff.txt
        code=${PIPESTATUS[0]}
        set -e
        if [ "$code" -eq 2 ]; then echo "styleproof-diff usage/capture error" >&2; exit 2; fi
        # Fail CLOSED on anything the contract doesn't define (a node crash, OOM kill,
        # SIGTERM, missing dist → 127/137/143/…): an undefined exit must never read as
        # "no reviewable style changes" and set a green status.
        if [ "$code" -ne 0 ] && [ "$code" -ne 1 ] && [ "$code" -ne 3 ]; then
          echo "styleproof-diff exited with unexpected code $code — failing closed (this is a crash, not a verdict)" >&2
          exit "$code"
        fi
        # 1 = computed-style differences; 3 = only NEW surfaces with no baseline.
        # Both need human review in approval mode. Every defined verdict publishes a receipt.
        if [ "$code" -eq 1 ] || [ "$code" -eq 3 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

    # Generate the human report before trust classification. Report-only structural
    # correspondence can discover a presentation/certification contradiction that the
    # raw differ cannot know about; merge that one coherence verdict back into the
    # machine payload so approval can never clear hidden raw review evidence.
    - id: report
      shell: bash
      env:
        STYLEPROOF_INCLUDE_CONTENT: ${{ inputs.include-content }}
        STYLEPROOF_REQUIRE_STATE_IDENTITY: ${{ inputs.require-state-identity }}
        STYLEPROOF_EXPECTED_BASE_SHA: ${{ steps.context.outputs.base-sha }}
        STYLEPROOF_EXPECTED_HEAD_SHA: ${{ steps.context.outputs.head-sha }}
      run: |
        set -euo pipefail
        rm -rf styleproof-report
        report_content_arguments=()
        state_identity_arguments=()
        trusted_sha_arguments=()
        if [ -z "$STYLEPROOF_EXPECTED_BASE_SHA" ] || [ -z "$STYLEPROOF_EXPECTED_HEAD_SHA" ]; then
          echo "trusted base/head SHA context is required for report generation" >&2
          exit 2
        fi
        trusted_sha_arguments+=(--expected-before-sha "$STYLEPROOF_EXPECTED_BASE_SHA")
        trusted_sha_arguments+=(--expected-after-sha "$STYLEPROOF_EXPECTED_HEAD_SHA")
        case "$STYLEPROOF_INCLUDE_CONTENT" in
          true) report_content_arguments+=(--include-content) ;;
          false) ;;
          *) echo "include-content must be true or false" >&2; exit 2 ;;
        esac
        case "$STYLEPROOF_REQUIRE_STATE_IDENTITY" in
          true) state_identity_arguments+=(--require-state-identity) ;;
          false) ;;
          *) echo "require-state-identity must be true or false" >&2; exit 2 ;;
        esac
        set +e
        node "$GITHUB_ACTION_PATH/bin/styleproof-report.mjs" "${{ inputs.baseline-dir }}" "${{ inputs.fresh-dir }}" --out styleproof-report ${trusted_sha_arguments[@]+"${trusted_sha_arguments[@]}"} ${report_content_arguments[@]+"${report_content_arguments[@]}"} ${state_identity_arguments[@]+"${state_identity_arguments[@]}"}
        report_exit_code=$?
        set -e
        if [ "$report_exit_code" -ne 0 ] && [ "$report_exit_code" -ne 1 ]; then
          echo "styleproof-report exited with code $report_exit_code — no trustworthy report was generated" >&2
          exit "$report_exit_code"
        fi
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';
        import { isDeepStrictEqual } from 'node:util';
        const mapStoreUrl = pathToFileURL(path.join(process.env.GITHUB_ACTION_PATH, 'dist/map-store.js')).href;
        const {
          hasDuplicateJsonKeys,
          MAX_CAPTURE_EVIDENCE_FILES,
          MAX_CAPTURE_EVIDENCE_FILE_BYTES,
          MAX_CAPTURE_EVIDENCE_TOTAL_BYTES,
        } = await import(mapStoreUrl);
        const parseReceipt = (filePath) => {
          const source = fs.readFileSync(filePath, 'utf8');
          const parsed = JSON.parse(source);
          if (hasDuplicateJsonKeys(source)) throw new Error('duplicate JSON key in StyleProof receipt');
          return parsed;
        };
        const diff = parseReceipt('styleproof-diff.json');
        const generated = parseReceipt('styleproof-report/report.json');
        const exactKeys = (value, keys) =>
          value &&
          typeof value === 'object' &&
          !Array.isArray(value) &&
          isDeepStrictEqual(Object.keys(value).sort(), [...keys].sort());
        const fullSha = (value) => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
        const EMPTY_CAPTURE_EVIDENCE_DIGEST = 'f48e6aba19b611a71a2cd234bf3994d257291364f54080d3ad4f1b5be79902fd';
        const emptyEvidenceSide = (value) =>
          value.fileCount === 0 && value.mapCount === 0 && value.byteCount === 0 &&
          value.digest === EMPTY_CAPTURE_EVIDENCE_DIGEST;
        const capturedEvidenceSide = (value) =>
          value.fileCount >= 2 && value.mapCount >= 1 && value.mapCount < value.fileCount &&
          value.byteCount >= (value.mapCount + 1) * 2 && value.digest !== EMPTY_CAPTURE_EVIDENCE_DIGEST;
        const validEvidenceSide = (value) =>
          exactKeys(value, ['algorithm', 'digest', 'fileCount', 'mapCount', 'byteCount']) &&
          value.algorithm === 'sha256' &&
          typeof value.digest === 'string' && /^[0-9a-f]{64}$/.test(value.digest) &&
          Number.isSafeInteger(value.fileCount) && value.fileCount >= 0 &&
          value.fileCount <= MAX_CAPTURE_EVIDENCE_FILES &&
          Number.isSafeInteger(value.mapCount) && value.mapCount >= 0 && value.mapCount <= value.fileCount &&
          Number.isSafeInteger(value.byteCount) && value.byteCount >= 0 &&
          value.byteCount <= MAX_CAPTURE_EVIDENCE_TOTAL_BYTES &&
          value.byteCount <= value.fileCount * MAX_CAPTURE_EVIDENCE_FILE_BYTES &&
          (emptyEvidenceSide(value) || capturedEvidenceSide(value));
        const validEvidenceBinding = (value) =>
          exactKeys(value, ['version', 'before', 'after']) && value.version === 1 &&
          validEvidenceSide(value.before) && validEvidenceSide(value.after);
        if (!validEvidenceBinding(diff.evidenceBinding) || !validEvidenceBinding(generated.evidenceBinding)) {
          throw new Error('StyleProof evidence-binding receipts are missing or malformed');
        }
        if (!isDeepStrictEqual(generated.evidenceBinding, diff.evidenceBinding)) {
          throw new Error('StyleProof evidence-binding receipts disagree');
        }
        const validBoundSide = (value, expected, evidence) => {
          if (!exactKeys(value, ['expected', 'observed', 'result']) || value.expected !== expected) return false;
          if (!fullSha(value.expected)) return false;
          if (value.result === 'matched') return value.observed === value.expected && capturedEvidenceSide(evidence);
          if (value.result === 'no-capture') return value.observed === null && emptyEvidenceSide(evidence);
          return false;
        };
        const validLockfileProvenanceSide = (value) =>
          exactKeys(value, ['lockfile', 'lockfileHash']) &&
          typeof value.lockfile === 'string' && /^[A-Za-z0-9._/-]+$/.test(value.lockfile) &&
          typeof value.lockfileHash === 'string' && /^[0-9a-f]{64}$/.test(value.lockfileHash);
        const validApplicationDependencyProvenance = (value) => {
          if (!exactKeys(value, ['status', 'before', 'after']) ||
              !validLockfileProvenanceSide(value.before) || !validLockfileProvenanceSide(value.after)) return false;
          const changed = value.before.lockfile !== value.after.lockfile ||
            value.before.lockfileHash !== value.after.lockfileHash;
          return value.status === (changed ? 'changed' : 'matched');
        };
        const validSourceBinding = (value, evidence) => {
          const keys = value?.applicationDependencyProvenance === undefined
            ? ['status', 'compatibility', 'before', 'after']
            : ['status', 'compatibility', 'applicationDependencyProvenance', 'before', 'after'];
          if (!exactKeys(value, keys) || value.status !== 'bound' ||
              (value.applicationDependencyProvenance !== undefined &&
                !validApplicationDependencyProvenance(value.applicationDependencyProvenance))) {
            return false;
          }
          if (!validBoundSide(value.before, process.env.STYLEPROOF_EXPECTED_BASE_SHA, evidence.before)) return false;
          if (!validBoundSide(value.after, process.env.STYLEPROOF_EXPECTED_HEAD_SHA, evidence.after)) return false;
          const bothObserved = value.before.observed !== null && value.after.observed !== null;
          return value.compatibility === (bothObserved ? 'matched' : 'not-applicable');
        };
        if (!validSourceBinding(diff.sourceBinding, diff.evidenceBinding) ||
            !validSourceBinding(generated.sourceBinding, generated.evidenceBinding)) {
          throw new Error('StyleProof source-binding receipts are missing, malformed, or not bound to trusted SHAs');
        }
        const validNoCaptureTopology = (receipt) => {
          const missingBefore = receipt.sourceBinding.before.result === 'no-capture';
          const missingAfter = receipt.sourceBinding.after.result === 'no-capture';
          if (!missingBefore && !missingAfter) return true;
          const counts = receipt.comparison?.counts;
          if (receipt.comparison?.status !== 'not-required' || !counts || counts.comparable !== 0 ||
              counts.incomparable !== 0 || counts.unproven !== 0 || counts.requiredUnproven !== 0 ||
              counts.globalRequiredUnproven !== 0 || !Array.isArray(receipt.comparability)) return false;
          const allowedReasons = new Set([
            ...(missingBefore ? ['missing-before'] : []),
            ...(missingAfter ? ['missing-after'] : []),
          ]);
          return receipt.comparability.every((entry) =>
            entry && entry.status === 'not-required' && entry.required === false && allowedReasons.has(entry.reason));
        };
        if (!validNoCaptureTopology(diff) || !validNoCaptureTopology(generated)) {
          throw new Error('StyleProof comparison topology disagrees with source and evidence receipts');
        }
        const validBaselineFailures = (value) =>
          Array.isArray(value) && value.length <= 10_000 && value.every((entry) =>
            exactKeys(entry, ['key', 'reason']) &&
            typeof entry.key === 'string' && entry.key.length > 0 && entry.key.length <= 256 &&
            !/[\u0000-\u001f\u007f]/.test(entry.key) && entry.reason === 'capture_failed');
        if (!validBaselineFailures(diff.baselineFailures) || !validBaselineFailures(generated.baselineFailures)) {
          throw new Error('StyleProof baseline-failure receipts are missing or malformed');
        }
        if (!isDeepStrictEqual(generated.baselineFailures, diff.baselineFailures)) {
          throw new Error('StyleProof baseline-failure receipts disagree');
        }
        if (generated.partialBaseline !== (diff.baselineFailures.length > 0) ||
            diff.partialBaseline !== generated.partialBaseline) {
          throw new Error('StyleProof baseline-failure trust state disagrees with its receipts');
        }
        const boundedSurfaceKey = (value) =>
          typeof value === 'string' && value.length > 0 && value.length <= 256 && !/[\u0000-\u001f\u007f]/.test(value);
        const explainedMissing = diff.explainedMissingBaselineSurfaces;
        if (!Array.isArray(explainedMissing) || explainedMissing.some((key) => !boundedSurfaceKey(key)) ||
            new Set(explainedMissing).size !== explainedMissing.length || !Array.isArray(diff.surfaces) ||
            !Array.isArray(generated.surfaces)) {
          throw new Error('StyleProof missing-baseline surface receipts are missing or malformed');
        }
        const diffMissing = diff.surfaces.filter((entry) => entry && (entry.missing === 'before' || entry.missing === 'after'));
        const reportMissing = generated.surfaces.filter((entry) => entry && Object.hasOwn(entry, 'missing'));
        const diffMissingBySurface = new Map();
        for (const entry of diffMissing) {
          if (!boundedSurfaceKey(entry.surface) || diffMissingBySurface.has(entry.surface)) {
            throw new Error('StyleProof missing-baseline surface receipts are missing or malformed');
          }
          diffMissingBySurface.set(entry.surface, entry.missing);
        }
        const reportMissingSurfaces = new Set();
        for (const entry of reportMissing) {
          const allowedKeys = Object.hasOwn(entry, 'image')
            ? ['surface', 'missing', 'isNew', 'isRemoved', 'baselineStatus', 'image']
            : ['surface', 'missing', 'isNew', 'isRemoved', 'baselineStatus'];
          if (!exactKeys(entry, allowedKeys) || !boundedSurfaceKey(entry.surface) ||
              reportMissingSurfaces.has(entry.surface) || diffMissingBySurface.get(entry.surface) !== entry.missing ||
              (Object.hasOwn(entry, 'image') && (typeof entry.image !== 'string' || entry.image.length === 0 || entry.image.length > 512))) {
            throw new Error('StyleProof missing-baseline surface receipts are missing or malformed');
          }
          reportMissingSurfaces.add(entry.surface);
          const explained = explainedMissing.includes(entry.surface);
          const expectedStatus = entry.missing === 'after' ? 'removed' : explained ? 'capture-failed' : 'new';
          if (entry.baselineStatus !== expectedStatus || entry.isNew !== (expectedStatus === 'new') ||
              entry.isRemoved !== (expectedStatus === 'removed')) {
            throw new Error('StyleProof missing-baseline surface classification disagrees with the validated diff');
          }
        }
        if (reportMissingSurfaces.size !== diffMissingBySurface.size ||
            [...diffMissingBySurface.keys()].some((surface) => !reportMissingSurfaces.has(surface)) ||
            explainedMissing.some((surface) => diffMissingBySurface.get(surface) !== 'before')) {
          throw new Error('StyleProof missing-baseline surface receipts disagree');
        }
        if (!generated.reportConsistency || typeof generated.reportConsistency.ok !== 'boolean') {
          throw new Error('styleproof-report/report.json has no valid reportConsistency verdict');
        }
        const contentEvaluationExpected = process.env.STYLEPROOF_INCLUDE_CONTENT === 'true';
        if (!generated.content || generated.content.evaluated !== contentEvaluationExpected ||
            !Number.isInteger(generated.content.changes) || generated.content.changes < 0) {
          throw new Error('styleproof-report/report.json has no valid content-evaluation receipt');
        }
        if (!generated.confidence || !generated.confidence.counts ||
            !Number.isInteger(generated.confidence.counts.inaccessible) ||
            generated.confidence.counts.inaccessible < 0) {
          throw new Error('styleproof-report/report.json has no valid confidence receipt');
        }
        const comparisonCertificationReceipt = (comparison) => ({
          status: comparison?.status,
          requireStateIdentity: comparison?.requireStateIdentity,
          blocksCertification: comparison?.blocksCertification,
          counts: comparison?.counts,
        });
        if (!isDeepStrictEqual(
              comparisonCertificationReceipt(generated.comparison),
              comparisonCertificationReceipt(diff.comparison),
            ) || !isDeepStrictEqual(generated.comparability, diff.comparability) ||
            !isDeepStrictEqual(generated.sourceBinding, diff.sourceBinding)) {
          throw new Error('styleproof-report/report.json report receipts disagree with the validated diff');
        }
        diff.reportConsistency = generated.reportConsistency;
        diff.confidence = generated.confidence;
        fs.writeFileSync('styleproof-diff.json', `${JSON.stringify(diff, null, 2)}\n`);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `content-changes=${generated.content.changes}\n`);
        NODE

    # One machine-readable verdict for every defined diff. Consumers should not
    # re-parse styleproof-diff.json or guess whether approval can clear the run.
    - id: verdict
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const { classifyStyleProofVerdict } = await import(`${process.env.GITHUB_ACTION_PATH}/dist/verdict.js`);
          const diff = JSON.parse(fs.readFileSync('styleproof-diff.json', 'utf8'));
          const verdict = classifyStyleProofVerdict(diff, {
            gateInventoryRemovals: '${{ steps.config.outputs.gate-inventory-removals }}' !== 'false',
            baseCaptureFailed: '${{ inputs.base-capture-failed }}'.toLowerCase() === 'true',
            changed: '${{ steps.diff.outputs.changed }}' === 'true',
          });
          const { state, reviewableChanged, dataResidueKeys } = verdict;
          diff.actionTrustState = state;
          fs.writeFileSync('styleproof-diff.json', `${JSON.stringify(diff, null, 2)}\n`);
          const reportPath = 'styleproof-report/report.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          report.actionTrustState = state;
          fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          core.setOutput('state', state);
          core.setOutput('reviewable-changed', reviewableChanged ? 'true' : 'false');
          core.setOutput('data-residue-keys', JSON.stringify(dataResidueKeys));
          core.info(`StyleProof trust state: ${state}`);

    # Is THIS commit's diff already signed off? Read the existing review status so a
    # re-run after approval keeps the check green (and renders the box ticked) instead
    # of clobbering the approval the approve workflow set. Only meaningful when changed.
    - id: gate
      if: steps.context.outputs.pr-number != '' && inputs.require-approval == 'true'
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        retries: 3
        script: |
          const changed = '${{ steps.diff.outputs.changed }}' === 'true';
          const sha = '${{ steps.context.outputs.head-sha }}';
          const STATUS = '${{ inputs.status-context }}';
          let approved = false;
          let approver = '';
          if (changed) {
            const { data } = await github.rest.repos.listCommitStatusesForRef({ ...context.repo, ref: sha, per_page: 100 });
            const mine = data.find((s) => s.context === STATUS);
            approved = !!mine && mine.state === 'success';
            // The approve workflow stamps "Approved by @x" into the status description,
            // so the comment can show who signed off even on a later report re-run.
            const m = approved && (mine.description || '').match(/Approved by @([A-Za-z0-9-]+)/);
            if (m) approver = m[1];
          }
          core.setOutput('approved', approved ? 'true' : 'false');
          core.setOutput('approver', approver);

    # Report images use RELATIVE paths so they render from the committed file (do
    # NOT pass --image-base-url — a raw.githubusercontent URL is fetched anonymously
    # by GitHub's Camo proxy and 404s on private repos).
    - id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        PR='${{ steps.context.outputs.pr-number }}'
        REPORT_PATH="pr-${PR:-${{ github.run_id }}}"
        REPORT_SHA='${{ steps.context.outputs.head-sha }}'
        [ -n "$REPORT_SHA" ] || REPORT_SHA='${{ github.sha }}'

        # Publish through the git-data API: costs the size of THIS report, not
        # the size of the branch. Cloning here (even bloblessly) made publish
        # O(branch) and started dying mid-transfer once the branch reached a
        # few GB. The script grafts the folder onto the current tip server-side,
        # retries the fast-forward race against concurrent publishes, verifies
        # the run receipt at the published commit (fail closed), and emits the
        # sha/url/raw-base outputs.
        node "$GITHUB_ACTION_PATH/bin/styleproof-publish-report.mjs" \
          --repository '${{ github.repository }}' \
          --branch '${{ inputs.report-branch }}' \
          --report-path "$REPORT_PATH" \
          --report-dir styleproof-report \
          --head-sha "$REPORT_SHA" \
          --run-id '${{ github.run_id }}' \
          --run-attempt '${{ github.run_attempt }}'

    - name: Upsert PR comment
      id: comment
      if: success() && steps.context.outputs.pr-number != ''
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        retries: 3
        script: |
          const fs = require('fs');
          const { shouldSupersedeExistingComment, formatRunAttemptReceiptMarker } =
            await import(`${process.env.GITHUB_ACTION_PATH}/dist/comment-supersession.js`);
          const { buildReportDelivery } =
            await import(`${process.env.GITHUB_ACTION_PATH}/dist/report-delivery.js`);
          const prNumber = Number('${{ steps.context.outputs.pr-number }}');
          const marker = '<!-- styleproof-report -->';
          // `changed` = review required: before/after differences OR new surfaces
          // with no baseline. Publication always supplies the durable receipt.
          const changed = '${{ steps.diff.outputs.changed }}' === 'true';
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo, issue_number: prNumber, per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          // Rerun-attempt ordering guard: a late-arriving delivery from an earlier
          // attempt of THIS run must not overwrite the verdict a newer attempt
          // already published. The comment records its writing attempt; a stale
          // delivery leaves the comment (and, downstream, the commit status) alone.
          const runId = '${{ github.run_id }}';
          const runAttempt = '${{ github.run_attempt }}';
          if (existing && !shouldSupersedeExistingComment({
            existingCommentBody: existing.body, runId, runAttempt,
          })) {
            core.setOutput('stale-delivery', 'true');
            core.info(`StyleProof: the report comment was already published by a later attempt of run ${runId} — leaving it (and the commit status) in place.`);
            return;
          }
          core.setOutput('stale-delivery', 'false');
          const upsert = (body) => existing
            ? github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            : github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });

          const url = '${{ steps.publish.outputs.url }}';
          const publicationSha = '${{ steps.publish.outputs.sha }}';
          const repositoryPrivate = context.payload.repository?.private;
          if (typeof repositoryPrivate !== 'boolean') {
            throw new Error('StyleProof report delivery: repository visibility is unknown');
          }
          const delivery = buildReportDelivery({
            repository: `${context.repo.owner}/${context.repo.repo}`,
            prNumber,
            publicationSha,
            reportUrl: url,
            repositoryVisibility: repositoryPrivate ? 'private' : 'public',
          });

          // The committed report is the COMPLETE source of truth — side-by-side crops
          // plus per-element property tables. The comment stays lean: the summary, one
          // approval box, and a link. It never duplicates the report (so the two can't
          // drift), and renders identically on public and private repos.
          const reportMd = fs.existsSync('styleproof-report/report.md') ? fs.readFileSync('styleproof-report/report.md', 'utf8') : '';
          const lines = reportMd.split('\n');
          const headEnd = lines.findIndex((l) => l.startsWith('### '));
          const summary = headEnd > 0 ? lines.slice(0, headEnd).join('\n').trim() : '## 🗺️ StyleProof report';

          const requireApproval = '${{ inputs.require-approval }}' === 'true';
          const approved = '${{ steps.gate.outputs.approved }}' === 'true';
          const approver = '${{ steps.gate.outputs.approver }}';
          const statusContext = '${{ inputs.status-context }}';
          const trustState = '${{ steps.verdict.outputs.state }}';
          // Bind approval to this exact commit so a post-report push can't inherit green.
          const headSha = '${{ steps.context.outputs.head-sha }}';

          const link = delivery.markdown;
          // One box signs off every change. On a re-run that's already approved it's
          // pre-ticked and carries "approved by @x" (reconstructed from the commit
          // status), so the comment matches the green status without re-running approval.
          const approvedBy = approved && approver ? ` — _approved by @${approver}_` : '';
          const box = requireApproval && trustState === 'STYLE_REVIEW_REQUIRED'
            ? ['', `- [${approved ? 'x' : ' '}] **Approve all changes**${approvedBy}`]
            : [];
          const trustGuidance = {
            DATA_RESIDUE_UNACKNOWLEDGED: '_Captured data fallbacks are unacknowledged — fix or fixture the endpoints; reviewer approval cannot clear this failure._',
            INVENTORY_REMOVAL_UNACKNOWLEDGED: '_A navigable affordance was removed without acknowledgement — repair or acknowledge it; reviewer approval cannot clear this failure._',
            CERTIFICATION_FAILED: '_Coverage, determinism, or report/diff consistency evidence is incomplete — repair the capture or reflow source; reviewer approval cannot clear this failure._',
            PARTIAL_BASELINE: '_Base capture is incomplete — repair baseline capture on the base branch; reviewer approval cannot clear missing baseline surfaces._',
            DEGRADED_BASELINE: '_The base capture failed, so this is a head-only receipt rather than a comparison — repair the base capture and rerun; reviewer approval cannot clear this failure._',
          }[trustState];
          const contentEvaluated = '${{ inputs.include-content }}' === 'true';
          const contentChanges = Number('${{ steps.report.outputs.content-changes }}');
          const cleanGuidance = contentEvaluated
            ? contentChanges > 0
              ? `_No reviewable computed-style changes detected. The report contains **${contentChanges} advisory content/structure change(s)**; they do not affect the **${statusContext}** check._`
              : `_No reviewable computed-style or advisory content/structure changes detected — the **${statusContext}** check is green._`
            : `_No reviewable computed-style changes detected — the **${statusContext}** check is green. Content/structure was not evaluated._`;
          const advisoryGuidance = changed
            ? `_StyleProof is advisory for this repository. Review the changed or new surfaces in the report; the **${statusContext}** check remains green._`
            : cleanGuidance;
          const footer = [
            '---',
            trustGuidance || (requireApproval
              ? !changed
                ? cleanGuidance
                : approved
                  ? `_Signed off — the **${statusContext}** check is green. A new push that changes styles or surfaces re-opens it._`
                  : `_Tick **Approve all changes** to turn the **${statusContext}** check green — write access required, and not the pull request author. One tick signs off every changed or new surface. A new push that changes styles or surfaces re-opens it._`
              : advisoryGuidance),
            ...(headSha ? [`<!-- styleproof-sha:${headSha} -->`] : []),
            formatRunAttemptReceiptMarker({ runId, runAttempt }),
          ];

          const body = [marker, summary, ...box, '', link, '', ...footer].join('\n');
          await upsert(body);

    # Review-gate mode: drive a commit status the approve workflow can flip,
    # instead of failing the job. Green when nothing changed; red ("needs
    # sign-off") until a write-access reviewer ticks the box. PR events only.
    # Skipped when the comment step classified this delivery as a stale earlier
    # attempt, so a late attempt-1 retry cannot clobber attempt 2's status either.
    - name: Set review status
      id: status
      if: >-
        steps.context.outputs.pr-number != '' && inputs.require-approval == 'true' &&
        steps.comment.outputs.stale-delivery != 'true'
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        retries: 3
        script: |
          const changed = '${{ steps.diff.outputs.changed }}' === 'true';
          const approved = '${{ steps.gate.outputs.approved }}' === 'true';
          const trustState = '${{ steps.verdict.outputs.state }}';
          const sha = '${{ steps.context.outputs.head-sha }}';
          const url = '${{ steps.publish.outputs.url }}';
          // Green when no review is needed OR a prior sign-off already approved this commit
          // (so re-running the report can't clobber an approval the approve workflow set).
          const green =
            trustState === 'NO_REVIEWABLE_STYLE_CHANGES' ||
            (trustState === 'STYLE_REVIEW_REQUIRED' && approved);
          const descriptions = {
            NO_REVIEWABLE_STYLE_CHANGES: 'No reviewable computed-style changes',
            STYLE_REVIEW_REQUIRED: approved
              ? 'StyleProof changes approved'
              : 'StyleProof changes need sign-off — tick the box in the report comment',
            DATA_RESIDUE_UNACKNOWLEDGED: 'Data residue must be fixed or acknowledged — approval cannot clear it',
            INVENTORY_REMOVAL_UNACKNOWLEDGED: 'Navigable removal must be fixed or acknowledged',
            CERTIFICATION_FAILED: 'Coverage, determinism, or report/diff consistency evidence is incomplete',
            PARTIAL_BASELINE: 'Base capture incomplete — repair baseline on the base branch',
            DEGRADED_BASELINE: 'Base capture failed — head-only evidence cannot certify this change',
          };
          await github.rest.repos.createCommitStatus({
            ...context.repo,
            sha,
            context: '${{ inputs.status-context }}',
            state: green ? 'success' : 'failure',
            description: descriptions[trustState] || `StyleProof trust failure: ${trustState}`,
            ...(changed && !approved && url ? { target_url: url } : {}),
          });

    # A failed base capture still publishes useful head evidence, but that receipt
    # is not a comparison and must never become green through reviewer approval.
    - name: Block on degraded baseline
      if: inputs.base-capture-failed == 'true'
      shell: bash
      run: |
        echo 'StyleProof: base capture failed — the published report is head-only degraded evidence, not a base-vs-head certification. Repair the base capture and rerun.' >&2
        exit 1

    # Partial baseline bundles compare what they can, but ledger-explained missing
    # base surfaces are repair debt — not NO_REVIEWABLE_STYLE_CHANGES and not approvable.
    - name: Block on partial baseline
      if: steps.verdict.outputs.state == 'PARTIAL_BASELINE'
      shell: bash
      run: |
        echo 'StyleProof: base capture is incomplete — repair baseline capture on the base branch for the missing surfaces listed in the report (approval cannot clear this).' >&2
        exit 1

    # blocking (on by default; opt out with styleproof.config.json "blocking": false): on
    # UNAPPROVED changes/new surfaces, fail the job so the check is red even on a repo
    # without a branch-protection rule requiring the status. Async by design — sign off in
    # the comment, then re-run this job; the re-run sees the approval (via the gate step)
    # and passes. Review-gate only.
    - name: Block on unapproved changes
      if: >-
        steps.context.outputs.pr-number != '' &&
        inputs.require-approval == 'true' &&
        steps.config.outputs.blocking == 'true' &&
        steps.verdict.outputs.state == 'STYLE_REVIEW_REQUIRED' &&
        steps.gate.outputs.approved != 'true'
      shell: bash
      run: |
        echo "StyleProof: unapproved style changes or new surfaces — tick 'Approve all changes' in the report comment, then re-run this job to clear the check." >&2
        exit 1

    # Certify mode: fail the job on any diff (default). Skipped
    # in review-gate mode, where the status check is the gate instead. New surfaces
    # set `changed`, so certification also fails when the capture set grows.
    - name: Fail on diff
      if: steps.diff.outputs.changed == 'true' && inputs.fail-on-diff == 'true' && inputs.require-approval != 'true'
      shell: bash
      run: |
        echo 'Style changes detected — review the PR comment. To accept, rebuild the map with styleproof-map and rerun the report.' >&2
        exit 1

    # Inventory hard-gate (runs LAST, in BOTH modes, after the report + comment publish so
    # a reviewer sees why): a removed navigable affordance — a route, tab, or menu item the
    # UI used to offer and HEAD no longer does — is a feature going unreachable. It is
    # categorically NOT a restyle to sign off on, so the style "approve all" box can't wave
    # it through; certify and review-gate mode alike fail hard on it UNLESS the removal is
    # acknowledged with a reason in styleproof.inventory.json. This is the source-of-truth
    # guarantee — a green never hides a feature that quietly disappeared. On by default;
    # opt out with "gateInventoryRemovals": false in styleproof.config.json.
    - name: Block on unacknowledged navigable removals
      if: steps.config.outputs.gate-inventory-removals != 'false'
      shell: bash
      run: |
        set -euo pipefail
        [ -f styleproof-diff.json ] || { echo "no styleproof-diff.json — nothing to gate"; exit 0; }
        # ARMED BUT NO DATA (#478): the gate is on, yet neither map carried an inventory
        # (j.inventory is null), so it had nothing to run on. This is a COULD-NOT-RUN, not
        # a pass — name it as a warning, and never let the run read as "inventory checked".
        # The report says `⚠ not checked` for the same reason. Still exit 0: the README
        # scopes this gate to `inventory: true`, so failing closed would break every spec
        # that predates it; the warning plus the report line are the visible signal, and
        # a team that wants enforcement sets `inventory: true` in the capture spec.
        if node -e "process.exit(require('./styleproof-diff.json').inventory == null ? 0 : 1)"; then
          echo "::warning::StyleProof: inventory gate COULD NOT RUN — it is armed, but no captured map carried an inventory, so no navigable removal could have been detected on this run. Set \`inventory: true\` in your capture spec (styleproof-init scaffolds this) to arm it with data, or opt out with \"gateInventoryRemovals\": false to stop arming it."
          exit 0
        fi
        # Unacknowledged removals AND stale acknowledgements both gate: a stale entry left
        # in styleproof.inventory.json pre-acknowledges the NEXT removal of that key.
        count="$(node -e "const j=require('./styleproof-diff.json'); const i=j.inventory||{}; process.stdout.write(String((i.unacknowledged||[]).length + (i.staleAcknowledgements||[]).length))")"
        if [ "${count:-0}" -gt 0 ]; then
          echo "::error::StyleProof: ${count} inventory gate failure(s) — removals without acknowledgement, or stale acknowledgements that must be pruned from styleproof.inventory.json."
          node -e "const j=require('./styleproof-diff.json'); const i=j.inventory||{}; for (const k of (i.unacknowledged||[])) console.log('  ✗ removed (unacknowledged): '+k); for (const k of (i.staleAcknowledgements||[])) console.log('  ✗ stale acknowledgement: '+k)"
          exit 1
        fi
        echo "✓ navigable inventory: no unacknowledged removals"

    # Canonical certification hard-gate (runs LAST in both modes): the verdict step
    # owns the closed-set trust predicate. Do not re-parse evidence here or approval
    # can exploit drift between two subtly different definitions of certification.
    - name: Block on unapprovable certification failures
      env:
        STYLEPROOF_TRUST_STATE: ${{ steps.verdict.outputs.state }}
      shell: bash
      run: |
        set -euo pipefail
        case "$STYLEPROOF_TRUST_STATE" in
          CERTIFICATION_FAILED|DATA_RESIDUE_UNACKNOWLEDGED)
            echo "::error::StyleProof: $STYLEPROOF_TRUST_STATE is a certification failure that approval cannot wave through."
            exit 1
            ;;
          *)
            echo "✓ certification: canonical trust verdict is $STYLEPROOF_TRUST_STATE"
            ;;
        esac

    # Always expose a terminal trust classification, even when a later gate fails.
    # Publication failure outranks every diff verdict because reviewers have no
    # durable evidence to inspect in that state.
    - id: trust
      if: always()
      uses: actions/github-script@v9
      with:
        script: |
          // Name the FAILURE DOMAIN precisely, so automation retries the right thing:
          //   publish 'failure'            → the publish step itself broke → REPORT_PUBLICATION_FAILED;
          //   publish 'skipped'/'cancelled' → an EARLIER step (capture/diff/config) failed —
          //     not a publication fault; report the verdict if one exists, else the
          //     capture/certification domain;
          //   comment/status delivery failed after a successful publish → the consumer-
          //     visible half of publication never landed → REPORT_PUBLICATION_FAILED,
          //     never a green classification from a run that delivered nothing.
          const publishOutcome = '${{ steps.publish.outcome }}';
          const diffState = '${{ steps.verdict.outputs.state }}';
          const deliveryFailed =
            '${{ steps.comment.outcome }}' === 'failure' || '${{ steps.status.outcome }}' === 'failure';
          let state;
          if (publishOutcome === 'failure') state = 'REPORT_PUBLICATION_FAILED';
          else if (publishOutcome !== 'success') state = diffState || 'CERTIFICATION_FAILED';
          else state = deliveryFailed ? 'REPORT_PUBLICATION_FAILED' : (diffState || 'CERTIFICATION_FAILED');
          core.setOutput('state', state);
          core.info(`StyleProof terminal trust state: ${state}`);
